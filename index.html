  // 壁のむこうへは行けないだけ（時間制限なし）。いま いる所までの道すじに線が残る
  var MAZE_PAIRS = [
    ["🐭", "🧀", "チーズ"], ["🐰", "🥕", "にんじん"], ["🐶", "🦴", "ほね"], ["🐵", "🍌", "バナナ"],
    ["🐻", "🍯", "はちみつ"], ["🐱", "🐟", "さかな"], ["🐿️", "🌰", "どんぐり"]
  ];
  var MZ = 10; // 1マスの大きさ（SVG の目盛り）
  var mz = null;

  function startMaze() {
    go("maze");
    mz = { i: 0, sizes: easy ? [[3, 2], [3, 3], [4, 3]] : [[4, 3], [5, 4], [6, 5]], pairs: shuffle(MAZE_PAIRS) };
    nextMaze();
  }

  // 1本道でつながった めいろを作る（どのマスからも、ゴールへの道はひとつだけ）。walls[マス] = [上, 右, 下, 左] の壁
  function makeMaze(W, H) {
    var walls = [], seen = [], stack = [0];
    for (var c = 0; c < W * H; c++) { walls.push([true, true, true, true]); seen.push(false); }
    seen[0] = true;
    while (stack.length) {
      var cur = stack[stack.length - 1], x = cur % W, y = Math.floor(cur / W), nb = [];
      if (y > 0 && !seen[cur - W]) nb.push([cur - W, 0, 2]);
      if (x < W - 1 && !seen[cur + 1]) nb.push([cur + 1, 1, 3]);
      if (y < H - 1 && !seen[cur + W]) nb.push([cur + W, 2, 0]);
      if (x > 0 && !seen[cur - 1]) nb.push([cur - 1, 3, 1]);
      if (!nb.length) { stack.pop(); continue; }
      var n = pick(nb);
      walls[cur][n[1]] = false;
      walls[n[0]][n[2]] = false;
      seen[n[0]] = true;
      stack.push(n[0]);
    }
    return walls;
  }

  function nextMaze() {
    if (mz.i >= mz.sizes.length) { finish(mz.sizes.length); return; }
    drawDots("mz-dots", mz.sizes.length, mz.i);
    var area = document.getElementById("mz-area");
    var W = mz.sizes[mz.i][0], H = mz.sizes[mz.i][1];
    var r = area.getBoundingClientRect();
    if (r.height > r.width * 1.05) { var t = W; W = H; H = t; } // たて長の画面では、めいろも たて長に
    var pair = mz.pairs[mz.i % mz.pairs.length];
    mz.W = W;
    mz.H = H;
    mz.walls = makeMaze(W, H);
    mz.pos = 0;           // 指で進めた先（いちばん新しい場所）
    mz.goal = W * H - 1;
    mz.path = [0];        // いま いる所までの道すじ
    mz.queue = [];        // これから1マスずつ動く道
    mz.moving = false;
    mz.done = false;
    var pr = document.getElementById("mz-prompt");
    pr.textContent = pair[2] + "まで いこう";
    say(pr.textContent);
    var d = "";
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var w = mz.walls[y * W + x];
      if (w[0]) d += "M" + x * MZ + " " + y * MZ + "h" + MZ;
      if (w[3]) d += "M" + x * MZ + " " + y * MZ + "v" + MZ;
      if (y === H - 1 && w[2]) d += "M" + x * MZ + " " + (y + 1) * MZ + "h" + MZ;
      if (x === W - 1 && w[1]) d += "M" + (x + 1) * MZ + " " + y * MZ + "v" + MZ;
    }
    var P = 3;
    area.innerHTML = '<svg class="mz-svg" viewBox="' + (-P) + " " + (-P) + " " + (W * MZ + 2 * P) + " " + (H * MZ + 2 * P) +
      '" preserveAspectRatio="xMidYMid meet">' +
      '<rect class="mz-floor" x="0" y="0" width="' + W * MZ + '" height="' + H * MZ + '"/>' +
      '<rect class="mz-goalcell" x="' + (W - 1) * MZ + '" y="' + (H - 1) * MZ + '" width="' + MZ + '" height="' + MZ + '"/>' +
      '<polyline class="mz-trail" points="' + MZ / 2 + "," + MZ / 2 + '"/>' +
      '<path class="mz-wall" d="' + d + '"/>' +
      '<text class="mz-emo mz-goal" x="' + (W - .5) * MZ + '" y="' + (H - .5) * MZ + '">' + pair[1] + '</text>' +
      '<g class="mz-hero" style="transform:translate(' + MZ / 2 + 'px,' + MZ / 2 + 'px)"><text class="mz-emo" x="0" y="0">' + pair[0] + '</text></g>' +
      '</svg>';
    mz.svg = area.querySelector("svg");
    mz.svg.addEventListener("pointerdown", mzPointer);
    mz.svg.addEventListener("pointermove", mzPointer);
    document.getElementById("mz-body").scrollTop = 0;
  }

  function mzOpen(c) {
    var w = mz.walls[c], out = [];
    if (!w[0]) out.push(c - mz.W);
    if (!w[1]) out.push(c + 1);
    if (!w[2]) out.push(c + mz.W);
    if (!w[3]) out.push(c - 1);
    return out;
  }
  // 壁を通らずに、maxLen マス以内で行ける道（行けなければ null）
  function mzRoute(from, to, maxLen) {
    var prev = {}, dist = {}, q = [from];
    prev[from] = -1;
    dist[from] = 0;
    while (q.length) {
      var c = q.shift();
      if (c === to) break;
      if (dist[c] >= maxLen) continue;
      mzOpen(c).forEach(function (n) {
        if (!(n in prev)) { prev[n] = c; dist[n] = dist[c] + 1; q.push(n); }
      });
    }
    if (!(to in prev)) return null;
    var r = [];
    for (var k = to; k !== from; k = prev[k]) r.unshift(k);
    return r;
  }

  // 指のあるマスへ、壁を通らずに近い道で行ければ進む（どうぶつを すべらせても、行きたいマスをタッチしてもよい）
  function mzPointer(e) {
    if (!mz || mz.done) return;
    if (e.type === "pointermove" && e.pointerType === "mouse" && !e.buttons) return;
    e.preventDefault();
    var m = mz.svg.getScreenCTM();
    if (!m) return;
    var pt = mz.svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    var p = pt.matrixTransform(m.inverse());
    var cx = Math.floor(p.x / MZ), cy = Math.floor(p.y / MZ);
    if (cx < 0 || cy < 0 || cx >= mz.W || cy >= mz.H) return;
    var route = mzRoute(mz.pos, cy * mz.W + cx, 4);
    if (!route || !route.length) return;
    mz.queue = mz.queue.concat(route);
    mz.pos = route[route.length - 1];
    if (mz.pos === mz.goal) mz.done = true;
    if (!mz.moving) mzStep();
  }

  function mzStep() {
    if (!mz.queue.length) {
      mz.moving = false;
      if (mz.done) mazeGoal();
      return;
    }
    mz.moving = true;
    var c = mz.queue.shift();
    // 来た道をもどったら、線ももどす
    if (mz.path.length > 1 && mz.path[mz.path.length - 2] === c) mz.path.pop(); else mz.path.push(c);
    var ctr = function (k) { return [(k % mz.W + .5) * MZ, (Math.floor(k / mz.W) + .5) * MZ]; };
    var xy = ctr(c);
    mz.svg.querySelector(".mz-hero").style.transform = "translate(" + xy[0] + "px," + xy[1] + "px)";
    mz.svg.querySelector(".mz-trail").setAttribute("points", mz.path.map(function (k) { return ctr(k).join(","); }).join(" "));
    play("step");
    later(mzStep, 95);
  }

  function mazeGoal() {
    mz.svg.querySelector(".mz-hero").classList.add("yay");
    burst(mz.svg.querySelector(".mz-goal"), 14);
    play("right");
    say("ゴール");
    later(function () { mz.i++; nextMaze(); }, 1800);
  }

  /* ============ ことばづくり ============ */
  // 絵を見て、文字カードを ことばの順にタッチする。わくには うすいお手本の字がある。
  // ちがうカードは小さくゆれるだけ（×なし）。1回まちがえると、正しいカードに枠が出る。
  // 字は、あいうえお なぞり と同じ46字だけ（「が」や小さい「っ」のある ことばは使わない）
  var KZ_WORDS = {
    2: [["いぬ", "🐕"], ["ねこ", "🐈"], ["くま", "🐻"], ["さる", "🐒"], ["うし", "🐄"], ["うま", "🐴"], ["かめ", "🐢"],
        ["たこ", "🐙"], ["かに", "🦀"], ["いか", "🦑"], ["あり", "🐜"], ["りす", "🐿️"], ["とり", "🐦"], ["しか", "🦌"],
        ["はな", "🌷"], ["ほし", "⭐"], ["つき", "🌙"], ["くも", "☁️"], ["もも", "🍑"], ["なし", "🍐"], ["なす", "🍆"],
        ["いえ", "🏠"], ["ふね", "🚢"], ["くつ", "👟"], ["かさ", "☂️"], ["すし", "🍣"]],
    3: [["さかな", "🐟"], ["くるま", "🚗"], ["みかん", "🍊"], ["すいか", "🍉"], ["めがね", "👓"], ["きつね", "🦊"],
        ["とけい", "⏰"], ["たいこ", "🥁"], ["さくら", "🌸"], ["きのこ", "🍄"], ["あひる", "🦆"], ["ひよこ", "🐤"],
        ["いるか", "🐬"], ["かえる", "🐸"], ["はさみ", "✂️"], ["えほん", "📖"]],
    4: [["ひこうき", "✈️"], ["にわとり", "🐓"], ["ふうせん", "🎈"], ["たいよう", "☀️"], ["ひまわり", "🌻"], ["くつした", "🧦"]]
  };
  var KANA46 = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
  var kz = null, lastKz = null;

  function startWord() {
    go("word");
    var G = GAMES.kotobazukuri;
    kz = { i: 0, sizes: (easy && G.easySizes) || G.sizes, used: [] };
    nextWord();
  }

  function nextWord() {
    if (kz.i >= kz.sizes.length) { finish(kz.sizes.length); return; }
    drawDots("kz-dots", kz.sizes.length, kz.i);
    var list = KZ_WORDS[kz.sizes[kz.i]].filter(function (w) { return kz.used.indexOf(w[0]) === -1 && w[0] !== lastKz; });
    var w = pick(list);
    kz.used.push(w[0]);
    lastKz = w[0];
    kz.word = w[0];
    kz.at = 0;
    kz.mistakes = 0;
    kz.lock = false;
    var letters = w[0].split("");
    var tiles = letters.slice();
    // 4さい〜 のときは、ことばに無い字のカードを1まい まぜる
    if (!easy) tiles.push(pick(KANA46.split("").filter(function (c) { return letters.indexOf(c) === -1; })));
    var pic = document.getElementById("kz-pic");
    pic.textContent = w[1];
    pic.classList.remove("yay");
    document.getElementById("kz-slots").innerHTML = letters.map(function (c) {
      return '<div class="kz-slot"><span class="ghost-ch">' + c + '</span></div>';
    }).join("");
    var box = document.getElementById("kz-tiles");
    box.innerHTML = "";
    mixed(tiles).forEach(function (c) {
      var b = el("button", "kz-tile");
      b.textContent = c;
      b.setAttribute("data-ch", c);
      b.addEventListener("click", function () { kzTap(b); });
      box.appendChild(b);
    });
    document.getElementById("kz-body").scrollTop = 0;
    say(w[0]);
  }

  function kzTap(b) {
    if (!kz || kz.lock || b.classList.contains("placed")) return;
    var want = kz.word.charAt(kz.at);
    if (b.getAttribute("data-ch") !== want) {
      kz.mistakes++;
      play("soft");
      b.classList.remove("shake");
      void b.offsetWidth;
      b.classList.add("shake");
      var right = document.querySelector('#kz-tiles .kz-tile[data-ch="' + want + '"]');
      if (right) right.classList.add("hint");
      return;
    }
    Array.prototype.forEach.call(document.querySelectorAll("#kz-tiles .hint"), function (x) { x.classList.remove("hint"); });
    b.classList.remove("shake");
    b.classList.add("placed");
    // 抜けた所に同じ大きさの すきまを残して、ほかのカードが動かないようにする
    var gap = el("span", "kz-tile");
    gap.style.visibility = "hidden";
    b.parentNode.insertBefore(gap, b);
    flipInto(b, document.querySelectorAll("#kz-slots .kz-slot")[kz.at]);
    b.classList.add("snap");
    play("place");
    say(want);
    kz.at++;
    if (kz.at < kz.word.length) return;
    kz.lock = true;
    record("kotobazukuri", kz.mistakes === 0);
    later(function () {
      var pic = document.getElementById("kz-pic");
      pic.classList.add("yay");
      burst(pic, 14);
      play("right");
      say(kz.word);
    }, 450);
    later(function () { kz.i++; nextWord(); }, 2200);
  }

  /* ============ シール ============ */
  // あそびを最後までやると1まいもらえる。ホームの「シール」で、ページのすきな所にはれる
  var STICKER_POOL = ["🐶", "🐱", "🐰", "🐻", "🐼", "🐨", "🐯", "🦁", "🐮", "🐷", "🐸", "🐵", "🐔", "🐧", "🐤", "🦄",
    "🐙", "🦀", "🐠", "🐳", "🦋", "🐞", "🐝", "🌷", "🌻", "🌈", "⭐", "🌙", "☀️", "🍎", "🍓", "🍒", "🍉", "🍩",
    "🍭", "🧁", "🍦", "🚗", "🚃", "🚀", "✈️", "🚒", "🎈", "🎀", "💎", "👑", "❤️", "🍀"];

  // まだ持っていない絵から出す（ぜんぶ持っていたら、どれでも）
  function giveSticker() {
    var have = stickers.map(function (s) { return s.e; });
    var fresh = STICKER_POOL.filter(function (e) { return have.indexOf(e) === -1; });
    var s = { e: pick(fresh.length ? fresh : STICKER_POOL), on: false, x: 0, y: 0, r: Math.round(Math.random() * 24 - 12) };
    stickers.push(s);
    if (stickers.length > 300) stickers = stickers.slice(-300);
    save(KEY_STICKERS, stickers);
    return s;
  }

  function renderStickers() {
    var page = document.getElementById("stk-page"), tray = document.getElementById("stk-tray");
    page.innerHTML = "";
    tray.innerHTML = "";
    stickers.forEach(function (s, i) {
      var d = el("div", "stk");
      d.textContent = s.e;
      d.setAttribute("data-i", i);
      d.style.setProperty("--r", s.r + "deg");
      if (s.on) {
        d.style.left = (s.x * 100).toFixed(2) + "%";
        d.style.top = (s.y * 100).toFixed(2) + "%";
        d.addEventListener("pointerdown", stkDown);
        d.addEventListener("pointermove", stkMove);
        d.addEventListener("pointerup", stkUp);
        d.addEventListener("pointercancel", stkUp);
        page.appendChild(d);
      } else {
        d.addEventListener("click", function () { stickOn(i); });
        tray.appendChild(d);
      }
    });
    if (!stickers.length) tray.innerHTML = '<div class="empty">あそびを さいごまで やると、シールが もらえるよ</div>';
    else if (!tray.children.length) tray.innerHTML = '<div class="empty">ぜんぶ はったよ</div>';
    document.getElementById("stk-count").textContent = stickers.length ? "シール " + stickers.length + "まい" : "";
  }

  // 下のシールをタッチすると、ページの あいている所に はる
  function stickOn(i) {
    var page = document.getElementById("stk-page");
    var W = page.clientWidth, H = page.clientHeight;
    var best = [.5, .5], bestGap = -1;
    for (var t = 0; t < 40; t++) {
      var x = .1 + Math.random() * .8, y = .14 + Math.random() * .74, gap = Infinity;
      stickers.forEach(function (o) { if (o.on) gap = Math.min(gap, Math.hypot((o.x - x) * W, (o.y - y) * H)); });
      if (gap > bestGap) { bestGap = gap; best = [x, y]; }
    }
    stickers[i].on = true;
    stickers[i].x = best[0];
    stickers[i].y = best[1];
    save(KEY_STICKERS, stickers);
    play("peta");
    renderStickers();
    var d = document.querySelector('#stk-page .stk[data-i="' + i + '"]');
    if (d) d.classList.add("pop");
  }

  // ページのシールは、指で うごかせる。下の たなへ もどすと、はがれる
  var sd = null;
  function stkDown(e) {
    e.preventDefault();
    var d = e.currentTarget;
    sd = { d: d, i: +d.getAttribute("data-i"), id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false };
    try { d.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function stkMove(e) {
    if (!sd || e.pointerId !== sd.id) return;
    var dx = e.clientX - sd.x0, dy = e.clientY - sd.y0;
    if (!sd.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
    sd.moved = true;
    sd.d.classList.add("lift");
    sd.d.style.translate = dx + "px " + dy + "px";
  }
  function stkUp(e) {
    if (!sd || e.pointerId !== sd.id) return;
    var s = sd;
    sd = null;
    if (!s.moved || e.type === "pointercancel") {
      s.d.style.translate = "";
      s.d.classList.remove("lift", "pop");
      void s.d.offsetWidth;
      s.d.classList.add("pop"); // タッチすると、ぷるんとする
      if (!s.moved) play("peta");
      return;
    }
    var st = stickers[s.i];
    var page = document.getElementById("stk-page").getBoundingClientRect();
    var tray = document.getElementById("stk-tray").getBoundingClientRect();
    if (e.clientY > tray.top && e.clientY < tray.bottom + 40) {
      st.on = false;
    } else {
      st.x = Math.max(.04, Math.min(.96, st.x + (e.clientX - s.x0) / page.width));
      st.y = Math.max(.05, Math.min(.95, st.y + (e.clientY - s.y0) / page.height));
    }
    save(KEY_STICKERS, stickers);
    play("peta");
    renderStickers();
  }

  /* ============ スケジュール ============ */
  function renderSched(justId) { // justId: いま押した項目（そこだけ はずませる）
    ensureToday();
    var box = document.getElementById("sched-list");
    box.innerHTML = "";
    if (!sched.length) {
      box.innerHTML = '<div class="empty">よていが ありません<br><span class="muted">（右上を3秒おしで 保護者メニュー）</span></div>';
      return;
    }
    var nowIdx = sched.findIndex(function (it) { return schedDone.done.indexOf(it.id) === -1; });
    sched.forEach(function (it, i) {
      var done = schedDone.done.indexOf(it.id) !== -1;
      var b = document.createElement("button");
      b.className = "sched-item" + (done ? " done" : "") + (i === nowIdx ? " now" : "");
      b.innerHTML = '<span class="ico">' + esc(it.ico) + '</span>' +
                    '<span class="label">' + esc(it.label) + '</span>' +
                    '<span class="check' + (it.id === justId ? " just" : "") + '">' + (done ? "✓" : "") + '</span>';
      b.addEventListener("click", function () {
        ensureToday();
        var p = schedDone.done.indexOf(it.id);
        var nowDone = p === -1;
        if (nowDone) schedDone.done.push(it.id); else schedDone.done.splice(p, 1);
        save(KEY_SCHED_DONE, schedDone);
        play(nowDone ? "check" : "tap");
        renderSched(nowDone ? it.id : null);
      });
      box.appendChild(b);
    });
  }

  // 開きっぱなしのまま日付が変わったとき・アプリに戻ってきたときに、表示を今日の状態に戻す
  function refreshDay() {
    if (ensureToday() && current === "sched") renderSched();
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refreshDay(); });
  setInterval(refreshDay, 60 * 1000);

  /* ============ 保護者モード ============ */
  var pressTimer = null;
  var lz = document.getElementById("lock-zone");
  function startPress() {
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () { go("parent"); }, 3000);
  }
  function endPress() { clearTimeout(pressTimer); }
  lz.addEventListener("touchstart", startPress, { passive: true });
  lz.addEventListener("touchend", endPress);
  lz.addEventListener("touchcancel", endPress);
  lz.addEventListener("mousedown", startPress);
  lz.addEventListener("mouseup", endPress);
  lz.addEventListener("mouseleave", endPress);

  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
  }

  function renderParent() {
    var body = document.getElementById("parent-body");
    var html = "";

    /* --- 課題別の記録 --- */
    html += "<h2>課題別の記録</h2><div class='panel'>";
    var any = false;
    html += "<table><tr><th>課題</th><th class='num'>回数</th><th class='num'>一発正解</th><th class='num'>率</th></tr>";
    recordedKeys().forEach(function (k) {
      var rows = log.filter(function (r) { return r.task === k; });
      if (!rows.length) return;
      any = true;
      var f = rows.reduce(function (s, r) { return s + r.first; }, 0);
      var rate = Math.round(f / rows.length * 100);
      html += "<tr><td>" + menuItem(k).label + "</td><td class='num'>" + rows.length +
              "</td><td class='num'>" + f + "</td><td class='num rate'>" + rate + "%</td></tr>";
    });
    html += "</table>";
    if (!any) html += "<p class='muted'>まだ記録がありません。</p>";
    html += "<p class='note'>「一発正解」＝ 間違えずに選べた回数（パズルは、まちがえずに完成できた回数）。ここが伸びているかを見る。<br>回数が少ないうちは率がぶれるので、30回くらい貯まってから傾向を読む。</p>";
    html += "</div>";

    /* --- 日ごと --- */
    html += "<h2>日ごとの一発正解率</h2><div class='panel'>";
    var byDay = {};
    log.forEach(function (r) {
      var d = dayKey(r.t);
      if (!byDay[d]) byDay[d] = { n: 0, f: 0 };
      byDay[d].n++; byDay[d].f += r.first;
    });
    var days = Object.keys(byDay).slice(-14);
    if (days.length) {
      html += "<table><tr><th>日</th><th class='num'>問</th><th class='num'>率</th></tr>";
      days.forEach(function (d) {
        var v = byDay[d];
        html += "<tr><td>" + d + "</td><td class='num'>" + v.n + "</td><td class='num rate'>" +
                Math.round(v.f / v.n * 100) + "%</td></tr>";
      });
      html += "</table>";
    } else {
      html += "<p class='muted'>まだ記録がありません。</p>";
    }
    html += "<button class='mini ghost' id='copy-log' style='margin-top:12px'>記録をコピー</button>";
    html += "<button class='mini warn' id='clear-log' style='margin-top:12px;margin-left:8px'>記録を消す</button>";
    html += "</div>";

    /* --- 音 --- */
    html += "<h2>音</h2><div class='panel'>";
    html += "<label class='edit-row vis-row' style='border-bottom:none'><input type='checkbox' id='snd'" +
            (soundOn ? " checked" : "") + "><span class='nm'>音を出す</span></label>";
    html += "<p class='note' style='margin-top:0'>やわらかい短い音だけを鳴らします（えらべた・はまった・割れた・おしまい）。" +
            "まちがえたときの音は出しません。<br>" +
            "iPad で鳴らないときは、音量と、本体の消音（サイレント）を確かめてください。</p>";
    html += "</div>";

    /* --- よみあげ --- */
    html += "<h2>よみあげ</h2><div class='panel'>";
    html += "<label class='edit-row vis-row' style='border-bottom:none'><input type='checkbox' id='voice'" +
            (voiceOn ? " checked" : "") + "><span class='nm'>お題を声で読む</span></label>";
    html += "<p class='note' style='margin-top:0'>「あか さがして」などのお題を、端末の日本語の声で読みます。白いお題のラベルをタッチすると、もう一度読みます。" +
            "てんつなぎでは数字を、ことばづくりでは文字とことばを読みます。<br>" +
            (synth ? "声の種類は iPad の「設定 → アクセシビリティ → 読み上げコンテンツ → 声」で変えられます。"
                   : "この端末では 読み上げが使えません。") + "</p>";
    html += "</div>";

    /* --- シール --- */
    var placed = stickers.filter(function (s) { return s.on; }).length;
    html += "<h2>シール</h2><div class='panel'>";
    html += "<p style='margin:0'>もらったシール：" + stickers.length + " まい（ページに はったもの " + placed + " まい）</p>";
    html += "<button class='mini warn' id='clear-stk' style='margin-top:10px'>シールを ぜんぶ消す</button>";
    html += "<p class='note'>あそびを最後までやると1まいもらえます（おえかき・ぬりえは、かいてから「できた」を押したとき）。" +
            "まだ持っていない絵から出ます。ホームの「シール」で、ページにはったり、うごかしたりできます。</p>";
    html += "</div>";

    /* --- あそぶ子に合わせる --- */
    html += "<h2>あそぶ子に合わせる</h2><div class='panel'>";
    html += "<div class='row'><button class='mini" + (easy ? "" : " ghost") + "' data-preset='young'>2〜3さい</button>" +
            "<button class='mini" + (easy ? " ghost" : "") + "' data-preset='old'>4さい〜</button></div>";
    html += "<p class='note'>2〜3さい：えらぶものを2つにして、パズルなどのピースも少なめにします。" +
            "読めなくても遊べるあそびだけメニューに出します。<br>" +
            "4さい〜：3つから選ぶ、ぜんぶのあそびを出します。<br>" +
            "下のチェックで、1つずつ変えることもできます。</p>";
    html += "</div>";

    /* --- メニューに出す あそび --- */
    html += "<h2>メニューに出す あそび</h2><div class='panel'>";
    MENU_ORDER.forEach(function (k) {
      var it = menuItem(k);
      html += "<label class='edit-row vis-row'><input type='checkbox' data-vis='" + k + "'" +
              (hidden.indexOf(k) === -1 ? " checked" : "") + ">" +
              icoHTML(it, "grip") + "<span class='nm'>" + it.label +
              "<span class='muted' style='font-size:.8em'>　" + (ageOf(k) >= 4 ? "4さい〜" : "2さい〜") + "</span></span></label>";
    });
    html += "<p class='note'>チェックを外すと、子どものメニューに出なくなります（記録は消えません）。<br>" +
            "選ぶものが多すぎて迷うときは、いま取り組んでいるものだけにしぼれます。</p>";
    html += "</div>";

    /* --- スケジュール編集 --- */
    html += "<h2>スケジュール</h2><div class='panel' id='sched-edit'>";
    sched.forEach(function (it, i) {
      html += "<div class='edit-row'><span class='grip'>" + esc(it.ico) + "</span>" +
              "<span class='nm'>" + esc(it.label) + "</span>" +
              "<button class='mini ghost' data-up='" + i + "'>↑</button>" +
              "<button class='mini warn' data-del='" + i + "'>削除</button></div>";
    });
    html += "<div class='row' style='margin-top:14px'>" +
            "<input type='text' class='emo-in' id='new-ico' placeholder='🍚' maxlength='4'>" +
            "<input type='text' class='lab-in' id='new-lab' placeholder='2語文まで（例：ごはん）' maxlength='12'>" +
            "<button class='mini' id='add-sched'>追加</button></div>";
    html += "<p class='note'>ラベルは短く。絵文字は iPhone/iPad のキーボードから入力できます。<br>チェックは毎日 0 時にリセットされます。</p>";
    html += "</div>";

    /* --- 使い方メモ --- */
    html += "<h2>設計メモ</h2><div class='panel'><p class='note' style='margin-top:0'>" +
            "・時間制限なし／問いかけなし／減点なし<br>" +
            "・音は「音」の欄で切り替え（初めは出る）。やわらかい短い音だけで、まちがえたときは鳴らない<br>" +
            "・間違えても×は出ず、選択肢が薄くなるだけ。1回外すと正解の枠がそっと出る<br>" +
            "・1セッション5問。上の星で「あと何問か」が見える＝終わりが目で見える<br>" +
            "・「あそぶ子に合わせる」で 2〜3さい にすると、選ぶものが2つになり、パズル・きおくのピースも少なくなる<br>" +
            "・なぞり／あいうえお／おえかきは記録なし。ゆびが少しずれても進むので、小さい子でも最後まで行ける<br>" +
            "・なぞりは「よこ線→なみ→うずまき」のように、やさしい順で3つ<br>" +
            "・あいうえお／カタカナ／すうじ なぞり は、お手本の字をそのまま出し、書く順に1画ずつ、なぞったところが緑になる（いまの画は少し濃く）。" +
            "五十音の並びでとなり合う3文字が出る（あ・い・う → か・き・く…）<br>" +
            "・パズルは1回3つで、ピースが2→3→4と増える。ちがう場所に置くと戻るだけで、1回まちがえるとそのピースと正しい場所に枠が出る。" +
            "指で動かすほか、ピースをタップ→置く場所をタップ でも置ける<br>" +
            "・同じ答えは続けて出さない（2通りしかない課題は3回続けない）。正解の場所も3回続けて同じにしない<br>" +
            "・しゃぼんだま・ふうせんは記録なしの自由あそび。逃げたり消えたりせず、8こ割ったらおしまい<br>" +
            "・もっきん：たたくと音が鳴る（指をすべらせても鳴る）。「うた」を選ぶと次にたたく板が光る。ちがう板も鳴るだけで、まちがいにしない（記録なし）<br>" +
            "・いないいない ばあ：タッチすると布が上がって、どうぶつが出てくる。8回でおしまい（記録なし）<br>" +
            "・ぬりえ：色を選んで、ぬりたい所をタッチ。線の中だけがぬれて、はみ出さない（記録なし）<br>" +
            "・てんつなぎ：1から順に点をつなぐと絵が出る。点は 5〜6 → 7〜8 → 9〜10 と増える。ちがう点を押すと、次の点がそっと光る（記録なし）<br>" +
            "・めいろ：ゆびで どうぶつを動かしてゴールへ。壁のむこうへは行けないだけで、時間制限なし。3→4→5だん と広くなる（記録なし）<br>" +
            "・ことばづくり：絵を見て、文字カードをことばの順にタッチ。わくに うすいお手本の字がある。2→3→4文字。" +
            "ちがうカードは ゆれるだけで、1回まちがえると正しいカードに枠が出る。4さい〜 のときは、ことばに無い字のカードが1まい まざる<br>" +
            "・シール：あそびを最後までやると1まいもらえる。ホームの「シール」で、ページにはれる<br>" +
            "・よみあげ：お題を端末の声で読む。お題のラベルをタッチすると もう一度読む<br>" +
            "・iPad の「アクセスガイド」（設定→アクセシビリティ）を使うとアプリから出られなくできる<br>" +
            "・保護者メニューは右上を3秒長押し" +
            "</p></div>";

    body.innerHTML = html;

    document.getElementById("add-sched").addEventListener("click", function () {
      var ico = document.getElementById("new-ico").value.trim() || "⭐";
      var lab = document.getElementById("new-lab").value.trim();
      if (!lab) return;
      sched.push({ id: newId(), ico: ico, label: lab });
      save(KEY_SCHED, sched);
      renderParent();
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () {
        var gone = sched.splice(parseInt(b.getAttribute("data-del"), 10), 1)[0];
        var p = gone ? schedDone.done.indexOf(gone.id) : -1;
        if (p !== -1) { schedDone.done.splice(p, 1); save(KEY_SCHED_DONE, schedDone); }
        save(KEY_SCHED, sched); renderParent();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-preset]"), function (b) {
      b.addEventListener("click", function () {
        var young = b.getAttribute("data-preset") === "young";
        easy = young;
        save(KEY_MODE, { easy: easy });
        hidden = young ? MENU_ORDER.filter(function (k) { return ageOf(k) >= 4; }) : [];
        save(KEY_HIDDEN, hidden);
        play("check");
        renderParent();
      });
    });
    document.getElementById("snd").addEventListener("change", function () {
      soundOn = this.checked;
      save(KEY_SOUND, { on: soundOn });
      play("check"); // 鳴るようになったか、その場で確かめられる
    });
    document.getElementById("voice").addEventListener("change", function () {
      voiceOn = this.checked;
      save(KEY_VOICE, { on: voiceOn });
      if (voiceOn) say("あか さがして"); // 聞こえるか、その場で確かめられる
      else hush();
    });
    document.getElementById("clear-stk").addEventListener("click", function () {
      if (confirm("もらったシールを すべて消します。よろしいですか？")) {
        stickers = [];
        save(KEY_STICKERS, stickers);
        renderParent();
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-vis]"), function (cb) {
      cb.addEventListener("change", function () {
        var k = cb.getAttribute("data-vis");
        hidden = hidden.filter(function (x) { return x !== k; });
        if (!cb.checked) hidden.push(k);
        save(KEY_HIDDEN, hidden);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-up]"), function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-up"), 10);
        if (i === 0) return;
        var t = sched[i - 1]; sched[i - 1] = sched[i]; sched[i] = t;
        save(KEY_SCHED, sched); renderParent();
      });
    });
    document.getElementById("clear-log").addEventListener("click", function () {
      if (confirm("記録をすべて消します。よろしいですか？")) {
        log = []; save(KEY_LOG, log); renderParent();
      }
    });
    document.getElementById("copy-log").addEventListener("click", function () {
      var lines = ["日付,課題,一発正解"];
      log.forEach(function (r) {
        lines.push(dayKey(r.t) + "," + (menuItem(r.task) ? menuItem(r.task).label : r.task) + "," + r.first);
      });
      var txt = lines.join("\n");
      function manual() { prompt("コピーしてください", txt); }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(function () { alert("コピーしました"); }, manual);
      } else {
        manual();
      }
    });
  }

  // 新しく増えた あそびは、2〜3さい向けにしているときは メニューに出さない（4さい〜 のもの。保護者メニューで出せる）
  (function () {
    var fresh = ["mokkin", "baa", "nurie", "tentsunagi", "meiro", "kotobazukuri"]; // この版で増えたもの
    var stored = null;
    try { stored = localStorage.getItem(KEY_KNOWN); } catch (e) {}
    var known = stored === null ? MENU_ORDER.filter(function (k) { return fresh.indexOf(k) === -1; }) : load(KEY_KNOWN, []);
    var added = MENU_ORDER.filter(function (k) { return known.indexOf(k) === -1; });
    if (easy && added.length) {
      added.forEach(function (k) { if (ageOf(k) >= 4 && hidden.indexOf(k) === -1) hidden.push(k); });
      save(KEY_HIDDEN, hidden);
    }
    save(KEY_KNOWN, MENU_ORDER);
  })();

  go("home");
})();
</script>
</body>
</html>
