<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="あそぼう">
<meta name="theme-color" content="#fbf5ea">
<title>あそぼう</title>
<!-- 丸くて太さのある文字（読みこめないときは端末の丸ゴシックになる） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
  :root {
    color-scheme: light; /* 子ども向けのため、ダークモードでも配色を固定する（コントラストと予測可能性を優先） */
    --bg: #fbf5ea;
    --card: #ffffff;
    --ink: #3b3129;
    --ink-soft: #7a6d60;
    --line: #ece2d3;
    --edge: #e7dac6;          /* 白いボタンの下のふち（押せるおもちゃの厚み） */
    --accent: #3fae78;
    --accent-soft: #e2f6e9;
    --accent-edge: #2f8f60;
    --warm: #f2a03d;
    --star-off: #eadfcd;
    --shadow: 0 12px 24px rgba(59,49,41,.08);
    --shape: #4f86c6;
    --k: 1; /* 絵の大きさの倍率。小さい画面では下で縮める */
  }
  @media (max-width: 520px), (max-height: 700px) { :root { --k: .74; } }
  @media (max-height: 500px) { :root { --k: .6; } } /* 横向きのスマホなど、とても背の低い画面 */

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { background: var(--bg); }
  html, body {
    margin: 0; padding: 0;
    color: var(--ink);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, -apple-system, sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
    /* 長押しで文字選択やメニューが出ないように（入力欄だけは選択できるよう下で戻す） */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  /* 四すみに うすい色のぼかしを置いた、やわらかい背景（動かない） */
  body {
    background:
      radial-gradient(45vmax 45vmax at 0% 0%, rgba(255, 205, 184, .45), transparent 70%),
      radial-gradient(40vmax 40vmax at 100% 0%, rgba(190, 226, 255, .5), transparent 70%),
      radial-gradient(45vmax 45vmax at 100% 100%, rgba(196, 237, 207, .5), transparent 70%),
      radial-gradient(40vmax 40vmax at 0% 100%, rgba(255, 234, 166, .45), transparent 70%),
      var(--bg);
  }

  /* 画面の高さに固定し、長いリストは各画面の中でスクロールさせる（もどるボタンが常に見える） */
  #app {
    max-width: 1100px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
  }

  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.on { display: flex; animation: screen-in .28s ease-out; }
  @keyframes screen-in { from { opacity: 0; translate: 0 10px; } }

  /* ---------- ホーム ---------- */
  .home-wrap {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: clamp(16px, 3.5vh, 28px);
  }
  /* ロゴ：1文字ずつ色をかえて、少しかたむけたシール風 */
  .logo {
    margin: 0 0 clamp(0px, 2vh, 16px); display: flex; gap: .04em;
    font-size: clamp(3rem, min(13vw, 12vh), 5.4rem); font-weight: 800; line-height: 1.15;
  }
  .logo span {
    display: inline-block;
    text-shadow: 3px 0 #fff, -3px 0 #fff, 0 3px #fff, 0 -3px #fff,
                 2px 2px #fff, -2px 2px #fff, 2px -2px #fff, -2px -2px #fff,
                 0 7px 0 rgba(59,49,41,.12);
  }
  .logo span:nth-child(1) { color: #ef6b5b; rotate: -8deg; }
  .logo span:nth-child(2) { color: #f4b23a; rotate: 5deg; animation-delay: .25s; }
  .logo span:nth-child(3) { color: #4cb47c; rotate: -4deg; animation-delay: .5s; }
  .logo span:nth-child(4) { color: #5b8fe0; rotate: 7deg; animation-delay: .75s; }
  /* 1文字ずつ、ゆっくり ゆれる */
  .logo span { animation: logo-bob 2.4s ease-in-out infinite alternate; }
  @keyframes logo-bob { from { translate: 0 3px; } to { translate: 0 -9px; } }

  /* 押すと沈む、おもちゃのようなボタン（下のふちが厚み） */
  .big-btn {
    --c1: var(--card); --c2: var(--edge);
    width: min(420px, 86vw);
    padding: 24px 20px;
    border: none; border-radius: 32px;
    background: var(--c1);
    box-shadow: 0 8px 0 var(--c2), 0 16px 28px rgba(59,49,41,.10);
    font-size: 2rem; font-weight: 800; color: var(--ink);
    font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--c2), 0 6px 14px rgba(59,49,41,.10); }
  .big-btn.play { --c1: #d8f3e2; --c2: #9ed5b5; }
  .big-btn.today { --c1: #ffe5d0; --c2: #f2b98d; }
  .big-btn.next { --c1: #d8f3e2; --c2: #9ed5b5; width: min(320px, 80vw); padding: 18px 20px; font-size: 1.7rem; }
  .big-btn .ico {
    font-size: 2.2rem; line-height: 1;
    width: 1.8em; height: 1.8em; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: rgba(255,255,255,.9); box-shadow: inset 0 -4px 0 rgba(59,49,41,.06);
  }
  @media (max-height: 520px) {
    .big-btn { padding: 12px 20px; }
    .big-btn .ico { font-size: 1.7rem; }
  }

  /* ---------- 共通ヘッダ ---------- */
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 18px; min-height: 56px;
  }
  .back {
    border: none; background: var(--card); color: var(--ink);
    border-radius: 20px; padding: 12px 22px;
    font-size: 1.2rem; font-weight: 700; font-family: inherit; cursor: pointer;
    box-shadow: 0 5px 0 var(--edge), 0 8px 16px rgba(59,49,41,.06);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .back:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge); }

  /* 進みぐあいの星（あと いくつか が目で見える）。星の形は clip-path で切りぬく */
  .dots { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .dot {
    width: 28px; height: 28px; background: var(--star-off);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .dot.done { background: linear-gradient(#ffd766, #ffb21e); }
  .dot.just { animation: star-pop .5s ease-out; }
  @keyframes star-pop { 0% { scale: .3; } 60% { scale: 1.35; } 100% { scale: 1; } }
  .dots.many { gap: 3px; }
  .dots.many .dot { width: 22px; height: 22px; }

  /* ---------- 課題メニュー ---------- */
  .menu-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 16px 14px; align-content: start; padding-bottom: 6px;
  }
  @media (min-width: 700px) { .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 22px 18px; } }
  @media (min-width: 1000px) { .menu-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1100px) { .menu-grid { grid-template-columns: repeat(6, 1fr); gap: 16px; } }
  /* 色は あそびごとに JS で --c1（面）--c2（ふち）を入れる */
  .menu-card {
    --c1: var(--card); --c2: var(--edge);
    border: none; border-radius: 28px; background: var(--c1);
    box-shadow: 0 6px 0 var(--c2), 0 12px 22px rgba(59,49,41,.07);
    padding: 18px 10px 16px;
    font-family: inherit; color: var(--ink); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: transform .1s ease, box-shadow .1s ease;
    /* メニューを開くと、カードが順番に ぽんぽんと出る（--i は JS で入れる並び順） */
    animation: card-in .34s ease-out backwards;
    animation-delay: calc(var(--i, 0) * .035s);
  }
  @keyframes card-in { from { opacity: 0; scale: .8; translate: 0 10px; } }
  .menu-card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c2), 0 6px 12px rgba(59,49,41,.07); }
  .menu-card .ico {
    font-size: 2.2rem; line-height: 1;
    width: 1.8em; height: 1.8em; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255,255,255,.88); box-shadow: inset 0 -4px 0 rgba(59,49,41,.06);
  }
  /* 「おおきい ちいさい」が「ちい／さい」のように途中で切れないよう、空白でだけ折り返す */
  .menu-card .label { font-size: 1.2rem; font-weight: 800; text-align: center; word-break: keep-all; overflow-wrap: anywhere; }
  @media (min-width: 700px) {
    .menu-card { padding: 22px 12px 18px; }
    .menu-card .ico { font-size: 2.4rem; width: 1.75em; height: 1.75em; }
    .menu-card .label { font-size: 1.35rem; }
  }
  /* あそびが増えても、iPad の横向きなら1画面に収まるように少しつめる（30こ＝6列×5段） */
  @media (min-width: 1100px) {
    .menu-grid { gap: 14px; }
    .menu-card { padding: 13px 8px 11px; gap: 7px; }
    .menu-card .ico { font-size: 2.25rem; width: 1.6em; height: 1.6em; }
    .menu-card .label { font-size: 1.25rem; line-height: 1.25; }
  }

  /* ---------- 課題画面 ---------- */
  .task-body { display: flex; flex-direction: column; }
  /* お題：白いラベル */
  .prompt {
    align-self: center; max-width: 100%;
    text-align: center; font-size: clamp(1.9rem, min(5vw, 6vh), 2.6rem);
    font-weight: 800; margin: 6px 0 26px; padding: .2em 1em .25em; letter-spacing: .04em;
    background: var(--card); border-radius: 999px;
    box-shadow: 0 5px 0 var(--edge), 0 10px 20px rgba(59,49,41,.06);
    word-break: keep-all; overflow-wrap: anywhere;
  }
  /* 新しいお題が出たら、ラベルが ちょっと はずむ */
  .prompt.pop { animation: prompt-pop .35s ease-out; }
  @keyframes prompt-pop { from { scale: .9; } }
  /* 背の低い画面（横向きのスマホなど）では余白をつめて、スクロールなしで収める */
  @media (max-height: 700px) { .prompt { margin: 2px 0 16px; } }
  /* おなじ・かげ の見本。押せる選択肢と区別できるよう、点線の枠にする */
  .sample {
    display: none; align-self: center;
    margin: -8px 0 22px; padding: calc(var(--k) * 14px) calc(var(--k) * 30px);
    background: rgba(255,255,255,.6); border: 3px dashed #d8c9b2; border-radius: 26px;
  }
  .sample.on { display: block; }
  .sample .emo { line-height: 1; display: block; }
  /* 横向きのスマホなど とても背の低い画面では、見本を選択肢の左にならべる */
  @media (max-height: 500px) {
    #task-body { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; align-items: center; }
    #task-body .prompt { grid-column: 1 / -1; justify-self: center; }
    #task-body .sample { margin: 0 0 24px 8px; }
    #task-body .choices { grid-column: 2; }
  }
  .choices {
    flex: 1 0 auto;
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center; align-content: center;
    gap: clamp(16px, 4vw, 40px);
    padding: 4px 0 24px;
  }
  .choice {
    border: 4px solid transparent; background: var(--card);
    border-radius: 30px; box-shadow: 0 6px 0 var(--edge), 0 12px 24px rgba(59,49,41,.07);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: calc(var(--k) * 16px);
    min-width: calc(var(--k) * 150px); min-height: calc(var(--k) * 150px);
    font-family: inherit;
    animation: choice-in .35s ease-out backwards;
    transition: opacity .3s ease, scale .3s ease, border-color .2s ease, background-color .2s ease, transform .1s ease, box-shadow .1s ease;
  }
  /* 問題が出るたびに、選択肢が順に ふわっと出る */
  .choice:nth-child(2) { animation-delay: .06s; }
  .choice:nth-child(3) { animation-delay: .12s; }
  @keyframes choice-in { from { opacity: 0; scale: .8; } }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--edge), 0 6px 12px rgba(59,49,41,.07); }
  .choice .emo { line-height: 1; display: block; }
  .choice.dim { opacity: .25; scale: .94; pointer-events: none; } /* 選べなくなったものは、そっとしぼむ */
  .choice.hint { border-color: var(--warm); }
  /* ヒントの枠より正解の色を優先。選べたら ぽよんと はずむ */
  .choice.right {
    border-color: var(--accent); background: var(--accent-soft);
    box-shadow: 0 6px 0 var(--accent-edge), 0 12px 26px rgba(63,174,120,.25);
    animation: pick .5s ease;
  }
  @keyframes pick { 0% { scale: 1; } 30% { scale: 1.12; } 60% { scale: .97; } 100% { scale: 1; } }

  /* いろ：つやのある玉（色は JS で background-color に入れる） */
  .swatch {
    display: block; width: calc(var(--k) * 110px); height: calc(var(--k) * 110px); border-radius: 50%;
    background-image: radial-gradient(circle at 34% 28%, rgba(255,255,255,.65), rgba(255,255,255,0) 40%);
    box-shadow: inset 0 -8px 14px rgba(0,0,0,.14), 0 4px 8px rgba(0,0,0,.08);
  }
  .shape {
    display: block; width: calc(var(--k) * 110px); height: calc(var(--k) * 110px);
    fill: var(--shape); filter: drop-shadow(0 4px 3px rgba(0,0,0,.12));
  }
  /* かげ：絵文字を黒く塗りつぶしてシルエットにする。正解すると色が戻る */
  .sil { filter: brightness(0); opacity: .75; transition: filter .4s ease, opacity .4s ease; }
  .choice.right .sil { filter: none; opacity: 1; }

  .group-box { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .group-row { display: flex; gap: 8px; }
  /* パターン：ならんだ色と、最後の「?」 */
  .seq { display: flex; align-items: center; gap: calc(var(--k) * 10px); flex-wrap: wrap; justify-content: center; }
  .seq .swatch { width: calc(var(--k) * 52px); height: calc(var(--k) * 52px); }
  .seq-q {
    display: flex; align-items: center; justify-content: center;
    width: calc(var(--k) * 52px); height: calc(var(--k) * 52px);
    border: 3px dashed var(--warm); border-radius: 50%;
    font-size: calc(var(--k) * 28px); font-weight: 800; color: var(--warm);
  }

  /* ---------- きおく ---------- */
  .mem-area {
    --C: min(calc(var(--k) * 112px), 15vh, 20vw);
    flex: 1 0 auto; display: grid; gap: clamp(8px, 1.6vw, 16px);
    justify-content: center; align-content: center; padding-bottom: 20px;
  }
  .mem-card { position: relative; width: var(--C); height: calc(var(--C) * 1.25); border: none; padding: 0; background: none; cursor: pointer; }
  .mem-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .38s ease; }
  .mem-card.open .mem-inner, .mem-card.done .mem-inner { transform: rotateY(180deg); }
  .mem-face {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    border-radius: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 5px 0 var(--edge), 0 10px 20px rgba(59,49,41,.08);
  }
  .mem-face.back { background: linear-gradient(#ffe3a0, #ffcb63); font-size: calc(var(--C) * .45); }
  .mem-face.front { background: var(--card); transform: rotateY(180deg); font-size: calc(var(--C) * .55); }
  .mem-card.done .mem-face.front { background: var(--accent-soft); box-shadow: 0 5px 0 var(--accent-edge); }

  /* ---------- なぞり ---------- */
  /* 残りの高さいっぱいに置く（中身の大きさで伸びないように flex-basis は 0） */
  .trace-area { flex: 1 1 0; min-height: calc(var(--k) * 200px); display: flex; align-items: center; justify-content: center; padding-bottom: 16px; }
  .trace-svg { width: 100%; height: 100%; touch-action: none; }
  .tr-track, .tr-done { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .tr-track { stroke: #e8ddca; }
  .tr-track.now { stroke: #dccdb0; }  /* いま なぞる画は少し濃く */
  .tr-track.later { opacity: .45; }   /* まだ なぞらない画は うすく */
  .tr-done { stroke: var(--accent); }
  /* 文字：フォントの字を見せ、なぞったところの字を緑にぬる（なぞる線は字の形で切りぬくので、字の外には出ない） */
  .tr-glyph { font-weight: 800; }
  .g-base { fill: #ebe1cf; }
  .whole .g-base { fill: var(--accent); }
  .on-letter .tr-track { stroke: transparent; }
  .on-letter .tr-done { stroke-width: 20; }
  .tr-now { display: none; fill: none; stroke: #d9c6a3; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
  .tr-now.on { display: inline; }
  .kana-ico { font-weight: 800; }
  .tr-goal { fill: var(--warm); }
  .tr-cursor {
    fill: #fff; stroke: var(--warm); stroke-width: 2.5;
    transform-box: fill-box; transform-origin: center;
    animation: cursor-pulse 1.1s ease-in-out infinite alternate;
  }
  @keyframes cursor-pulse { from { scale: .75; } to { scale: 1.25; } }

  /* ---------- おえかき ---------- */
  .draw-area { flex: 1; min-height: 0; background: var(--card); border-radius: 26px; box-shadow: 0 6px 0 var(--edge), var(--shadow); overflow: hidden; }
  #draw-canvas { display: block; touch-action: none; }
  .draw-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 14px 0 2px; }
  .pen {
    width: 46px; height: 46px; border-radius: 50%; border: 4px solid #fff; cursor: pointer; padding: 0;
    box-shadow: 0 3px 0 rgba(59,49,41,.15), 0 6px 12px rgba(59,49,41,.12);
  }
  .pen.on { border-color: var(--ink); scale: 1.12; }
  .draw-tools .mini { font-size: 1.05rem; padding: 12px 20px; border-radius: 16px; }
  .ico-svg { display: block; width: 1em; height: 1em; }

  /* ---------- おわり ---------- */
  .finish {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: clamp(16px, 3vh, 26px);
  }
  /* あつめた星が、ひとつずつ ぽんと出る（数えるための星で、点数ではない） */
  .stars { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .stars .dot { width: calc(var(--k) * 64px); height: calc(var(--k) * 64px); animation: star-pop .5s ease-out backwards; }
  .stars.many { gap: 6px; }
  .stars.many .dot { width: calc(var(--k) * 44px); height: calc(var(--k) * 44px); }
  .finish .txt { font-size: 2.4rem; font-weight: 800; }
  /* おしまいに出てくる どうぶつ（毎回かわる）が ぴょんと はねる */
  .mascot { font-size: clamp(3rem, 11vh, 5rem); line-height: 1; animation: hop 1.7s ease-in-out infinite; }
  @keyframes hop {
    0%, 55%, 100% { translate: 0 0; scale: 1 1; }
    12% { translate: 0 -20px; scale: .94 1.06; }
    30% { translate: 0 0; scale: 1.06 .94; }
    40% { translate: 0 -7px; }
  }

  /* ---------- しゃぼんだま・ふうせん ---------- */
  .pond {
    position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 30px;
    background:
      radial-gradient(70px 26px at 16% 20%, rgba(255,255,255,.95), transparent 70%),
      radial-gradient(100px 36px at 22% 24%, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(90px 30px at 80% 13%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(60px 22px at 86% 17%, rgba(255,255,255,.85), transparent 70%),
      linear-gradient(180deg, #cdeaf8 0%, #e6f5f3 62%, #f7f1e3 100%);
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.7), 0 10px 24px rgba(59,49,41,.06);
  }
  .popper {
    position: absolute; padding: 0; border: none; background: none; cursor: pointer;
    transition: transform .25s ease, opacity .25s ease;
  }
  .popper.new { transform: scale(.3); opacity: 0; }
  .popper.pop { transform: scale(1.35); opacity: 0; pointer-events: none; animation-play-state: paused; }
  .bubble {
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 8%, rgba(255,255,255,0) 20%),
      radial-gradient(circle, hsla(var(--h), 85%, 80%, .22) 0 50%, hsla(var(--h), 75%, 58%, .72) 100%);
    box-shadow: inset 0 0 0 3px hsla(var(--h), 70%, 55%, .55), 0 6px 18px rgba(46,42,36,.08);
    animation: bob 3.2s ease-in-out infinite alternate;
  }
  @keyframes bob { from { translate: 0 -10px; } to { translate: 0 10px; } }
  /* ふうせん：下から ふわっと上がってきて、その場で ゆれる（飛んでいかない） */
  .balloon {
    transform-origin: 50% 100%;
    animation: sway 3.6s ease-in-out infinite alternate;
    transition: top 2.4s cubic-bezier(.2, .8, .3, 1), transform .25s ease, opacity .25s ease;
  }
  .balloon.pop { transform-origin: 50% 33%; }
  .balloon svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 8px 8px rgba(59,49,41,.14)); }
  .b-body, .b-knot { fill: var(--c); }
  .b-shade { fill: #000; opacity: .1; }
  .b-shine { fill: #fff; opacity: .55; }
  .b-string { fill: none; stroke: #b3a590; stroke-width: 2; stroke-linecap: round; }
  @keyframes sway { from { translate: 0 -6px; rotate: -3deg; } to { translate: 0 6px; rotate: 3deg; } }

  /* 正解・完成・割れたとき の小さな粒（音なし・0.7秒で消える） */
  .spark {
    position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
    width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    animation: spark .7s ease-out forwards;
  }
  .spark.star {
    width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 0;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  @keyframes spark { to { translate: var(--dx) var(--dy); scale: .3; opacity: 0; } }

  /* ---------- パズル（かたちはめ・えあわせ） ---------- */
  .pz-area {
    /* 盤とピースが縦に並んでも、スクロールせずに1画面に収まる大きさにする */
    --P: min(calc(var(--k) * 118px), 13vh); /* かたちはめ のピース */
    --S: min(calc(var(--k) * 250px), 28vh); /* えあわせ の絵 */
    flex: 1 0 auto;
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center; align-content: center;
    gap: clamp(22px, 5vw, 60px);
    padding-bottom: 20px;
  }
  /* 木のおもちゃの板 */
  .pz-board {
    border-radius: 26px;
    background: linear-gradient(#f5e7cf, #e8d2ae);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.55), 0 6px 0 #d6bb92, 0 12px 24px rgba(59,49,41,.08);
    transition: box-shadow .3s ease;
  }
  .pz-board.hame { display: grid; gap: calc(var(--k) * 18px); padding: calc(var(--k) * 18px); }
  .pz-board.frame { padding: calc(var(--k) * 12px); }
  .pz-board.done {
    box-shadow: 0 0 0 5px var(--accent), 0 6px 0 #d6bb92, 0 12px 26px rgba(63,174,120,.25);
    animation: pz-done .6s ease;
  }
  @keyframes pz-done { 40% { scale: 1.04; } }
  .pz-tray { display: grid; gap: calc(var(--k) * 18px); justify-content: center; }
  .pz-tray.strips { gap: calc(var(--k) * 12px); }

  .pz-slot { position: relative; cursor: pointer; }
  .hame .pz-slot, .pz-cell.shape, .pz-piece.shape { width: var(--P); height: var(--P); }
  .hole { display: block; width: 100%; height: 100%; fill: #c9ab7f; paint-order: stroke; }
  .pz-slot.hint .hole { stroke: var(--warm); stroke-width: 7; }

  .pz-grid { position: relative; display: grid; width: var(--S); height: var(--S); background: var(--card); }
  .pz-grid .pz-slot::after {
    content: ""; position: absolute; inset: 3px; border-radius: 6px;
    border: 2px dashed rgba(46,42,36,.2); pointer-events: none;
  }
  .pz-grid .pz-slot.filled::after { display: none; }
  .pz-grid .pz-slot.hint::after { border: 3px solid var(--warm); }
  /* 絵はピースごとに同じ大きさで描き、帯の位置だけずらして見せる（はめると1枚の絵になる） */
  .pic {
    position: absolute; left: 0; top: 0; width: var(--S); height: var(--S);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--S) * .88); line-height: 1; pointer-events: none; overflow: hidden;
  }
  .pic.ghost { opacity: .22; filter: grayscale(1); }
  .pz-cell.strip, .pz-piece.strip { width: var(--S); height: calc(var(--S) / var(--n)); }

  .pz-piece { position: relative; touch-action: none; cursor: grab; transition: translate .3s ease, scale .15s ease; }
  .pz-piece svg { display: block; width: 100%; height: 100%; pointer-events: none; filter: drop-shadow(0 3px 3px rgba(46,42,36,.25)); }
  .pz-piece.strip { overflow: hidden; background: var(--card); border-radius: 10px; box-shadow: 0 4px 0 var(--edge), 0 8px 16px rgba(59,49,41,.08); }
  .pz-piece.strip .pic { top: calc(var(--S) / var(--n) * var(--r) * -1); }
  .pz-piece.sel, .pz-piece.lift { scale: 1.08; z-index: 20; }
  .pz-piece.strip.sel, .pz-piece.strip.lift { box-shadow: 0 10px 24px rgba(46,42,36,.22); }
  .pz-piece.shape.hint svg { filter: drop-shadow(0 0 3px var(--warm)) drop-shadow(0 0 5px var(--warm)); }
  .pz-piece.strip.hint { box-shadow: 0 0 0 4px var(--warm); }
  /* はまったピース。すべって来たあとに、ぷるんと はずむ */
  .pz-slot .pz-piece { position: absolute; left: 0; top: 0; cursor: default; }
  .pz-slot .pz-piece.snap { animation: snap .4s ease .22s; }
  @keyframes snap { 0% { scale: 1; } 35% { scale: 1.08; } 70% { scale: .98; } 100% { scale: 1; } }
  .pz-slot .pz-piece svg { filter: none; }
  .pz-slot .pz-piece.strip { border-radius: 0; box-shadow: none; }
  @media (max-height: 700px) { .pz-area { padding-bottom: 8px; } }

  /* ---------- スケジュール ---------- */
  .sched-list { display: flex; flex-direction: column; gap: 16px; padding-bottom: 6px; }
  .sched-item {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border-radius: 26px; padding: 12px 18px 12px 12px;
    box-shadow: 0 6px 0 var(--edge), 0 12px 22px rgba(59,49,41,.06);
    border: 4px solid transparent;
    cursor: pointer; font-family: inherit; text-align: left; width: 100%;
    color: var(--ink);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .sched-item:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--edge); }
  .sched-item .ico {
    font-size: 2.2rem; line-height: 1; flex: none;
    width: 1.9em; height: 1.9em; border-radius: 50%;
    display: grid; place-items: center; background: #fff3dc;
  }
  .sched-item .label { font-size: 1.6rem; font-weight: 800; flex: 1; }
  .sched-item .check {
    width: 46px; height: 46px; border-radius: 50%;
    border: 4px solid var(--line); flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 800; color: #fff;
  }
  .sched-item.now { border-color: var(--warm); background: #fffaf0; }
  .sched-item.done { opacity: .5; }
  .sched-item.done .check { background: var(--accent); border-color: var(--accent); }
  .sched-item .check.just { animation: star-pop .45s ease-out; } /* いま押した項目だけ はずむ */
  .empty { color: var(--ink-soft); font-size: 1.1rem; text-align: center; padding: 40px 10px; line-height: 1.9; grid-column: 1 / -1; }

  /* ---------- 保護者 ---------- */
  .lock-zone {
    position: fixed; top: 0; right: 0; width: 84px; height: 84px;
    z-index: 50;
  }
  .parent { font-size: .98rem; line-height: 1.75; }
  .parent h2 { font-size: 1.25rem; font-weight: 800; margin: 26px 0 10px; }
  .parent h2:first-of-type { margin-top: 6px; }
  .panel {
    background: var(--card); border-radius: 22px; padding: 16px 18px;
    box-shadow: 0 4px 0 var(--edge), var(--shadow); margin-bottom: 14px;
  }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { padding: 9px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-soft); font-weight: 700; font-size: .85rem; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rate { font-weight: 800; }
  .muted { color: var(--ink-soft); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type="text"] {
    font-family: inherit; font-size: 1rem; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
    -webkit-user-select: text; user-select: text;
  }
  input.emo-in { width: 64px; text-align: center; font-size: 1.4rem; }
  input.lab-in { flex: 1; min-width: 120px; }
  .mini {
    border: none; border-radius: 14px; padding: 10px 16px;
    font-family: inherit; font-size: .95rem; font-weight: 700; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .mini.ghost { background: var(--accent-soft); color: var(--accent-edge); }
  .mini.warn { background: #f7e3e0; color: #b0574c; }
  .edit-row {
    display: flex; gap: 8px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .edit-row .grip { font-size: 1.5rem; width: 1.4em; flex: none; display: flex; justify-content: center; }
  .edit-row .nm { flex: 1; font-size: 1rem; }
  .vis-row { cursor: pointer; }
  .vis-row input { width: 24px; height: 24px; margin: 0 4px 0 0; flex: none; accent-color: var(--accent); }
  .note { font-size: .85rem; color: var(--ink-soft); line-height: 1.8; margin-top: 8px; }
  /* 影が切れないよう内側に余白をとり、その分を外側のマイナス余白で戻す */
  .scroll {
    overflow-y: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch;
    margin: -8px -12px 0; padding: 8px 12px 16px;
  }

  /* ---------- 共通：小さな切りかえボタン（もっきんの うた など） ---------- */
  .pills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 0 0 12px; }
  .pill {
    border: none; border-radius: 999px; padding: 10px 18px;
    font-family: inherit; font-size: 1.15rem; font-weight: 800; color: var(--ink);
    background: var(--card); cursor: pointer;
    box-shadow: 0 4px 0 var(--edge), 0 8px 14px rgba(59,49,41,.06);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .pill:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .pill.on { background: var(--accent-soft); box-shadow: inset 0 0 0 3px var(--accent), 0 4px 0 var(--accent-edge); }
  @media (max-height: 500px) { .pill { padding: 6px 14px; font-size: 1rem; } }

  /* ---------- もっきん ---------- */
  .song-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; min-height: 16px; margin: 0 0 6px; }
  .song-dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--star-off); }
  .song-dots span.done { background: var(--c); }
  .song-dots span.now { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--warm); }
  /* 木のわくに、色の板をならべる。横長の画面では横に、たて長の画面では たてに */
  .xylo {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    gap: clamp(6px, 1.3vw, 14px); padding: 18px 16px 22px; margin-bottom: 8px; touch-action: none;
    border-radius: 30px; background: linear-gradient(#f5e7cf, #e8d2ae);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.55), 0 6px 0 #d6bb92, 0 12px 24px rgba(59,49,41,.08);
  }
  .mk-key {
    --c: #e53935; position: relative; flex: 1 1 0; max-width: 118px; height: calc(var(--len) * 100%);
    border-radius: 18px; cursor: pointer;
    background: linear-gradient(90deg, rgba(0,0,0,.08), rgba(255,255,255,.22) 35%, rgba(0,0,0,.06)), var(--c);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.14), 0 5px 0 rgba(59,49,41,.18);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 14%;
  }
  /* 板を止めている くぎ */
  .mk-key::before, .mk-key::after {
    content: ""; position: absolute; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #c8b9a0);
  }
  .mk-key::before { top: 8%; }
  .mk-key::after { bottom: 5%; }
  .mk-name { color: #fff; font-weight: 800; font-size: clamp(1.1rem, 2.6vw, 1.7rem); text-shadow: 0 2px 0 rgba(0,0,0,.2); pointer-events: none; }
  .mk-star { font-size: clamp(1.4rem, 3vw, 2.2rem); line-height: 1; margin-bottom: auto; margin-top: 60%; visibility: hidden; pointer-events: none; }
  .mk-key.next { box-shadow: 0 0 0 5px #fff, 0 0 0 9px var(--warm), 0 5px 0 rgba(59,49,41,.18); }
  .mk-key.next .mk-star { visibility: visible; animation: star-pop .5s ease-out; }
  .mk-key.hit { animation: key-hit .28s ease; }
  @keyframes key-hit { 30% { scale: .95; filter: brightness(1.18); } }
  @media (orientation: portrait) {
    .xylo { flex-direction: column; padding: 16px 18px; }
    .mk-key { flex: 1 1 0; max-width: none; max-height: 96px; width: calc(var(--len) * 100%); height: auto;
              flex-direction: row; justify-content: flex-end; padding: 0 14% 0 0; }
    .mk-key::before, .mk-key::after { top: 50%; margin-top: -6px; bottom: auto; }
    .mk-key::before { left: 7%; }
    .mk-key::after { left: auto; right: 5%; }
    .mk-star { margin: 0 auto 0 22%; }
  }
  /* 板をたたくと、音符が ふわっと上がる */
  .fnote { position: fixed; z-index: 60; pointer-events: none; font-size: 30px; font-weight: 800; line-height: 1;
           margin: -15px 0 0 -10px; animation: fnote .9s ease-out forwards; }
  @keyframes fnote { to { translate: var(--dx) -90px; opacity: 0; scale: 1.3; } }

  /* ---------- いないいないばあ ---------- */
  .baa-stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; cursor: pointer; }
  .baa-animal { font-size: min(40vh, 52vw); line-height: 1; }
  .baa-animal.show { animation: hop 1.7s ease-in-out infinite; }
  /* 布は上へ持ち上がる。ゆれは中の絵だけ（持ち上げる動きとぶつからないように） */
  .baa-cloth {
    position: absolute; left: 50%; top: 50%; width: min(52vh, 68vw); height: min(52vh, 68vw);
    margin: calc(min(52vh, 68vw) / -2) 0 0 calc(min(52vh, 68vw) / -2);
    transition: translate .5s cubic-bezier(.3, .7, .3, 1), rotate .5s ease, opacity .45s ease;
  }
  .baa-cloth.up { translate: 0 -115%; rotate: -12deg; opacity: 0; }
  .baa-cloth svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 12px rgba(59,49,41,.18));
                   animation: cloth-sway 2.2s ease-in-out infinite alternate; transform-origin: 50% 10%; }
  @keyframes cloth-sway { from { rotate: -2.5deg; } to { rotate: 2.5deg; } }

  /* ---------- ぬりえ ---------- */
  .nurie-area {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px;
    background: var(--card); border-radius: 26px; box-shadow: 0 6px 0 var(--edge), var(--shadow);
  }
  .nurie-svg { width: 100%; height: 100%; touch-action: manipulation; }
  .rg { fill: #fff; stroke: #4a3f35; stroke-width: 1.4; stroke-linejoin: round; cursor: pointer; transition: fill .25s ease; }
  .nurie-svg .dt { pointer-events: none; }
  .pen.white { box-shadow: inset 0 0 0 2px #ddd2c2, 0 3px 0 rgba(59,49,41,.15), 0 6px 12px rgba(59,49,41,.12); }

  /* ---------- てんつなぎ ---------- */
  .ts-area { flex: 1 1 0; min-height: calc(var(--k) * 200px); display: flex; align-items: center; justify-content: center; padding-bottom: 16px; }
  .ts-svg { width: 100%; height: 100%; touch-action: none; }
  .ts-dot { fill: #fff; stroke: #5a4a36; stroke-width: 1.1; transform-box: fill-box; transform-origin: center; }
  .ts-dot.on { fill: var(--accent); stroke: var(--accent-edge); }
  .ts-dot.start, .ts-dot.hint { stroke: var(--warm); stroke-width: 1.7; animation: cursor-pulse 1s ease-in-out infinite alternate; }
  .ts-dot.nope { animation: shake .4s ease; }
  .ts-num { font-size: 6.5px; font-weight: 800; fill: var(--ink); text-anchor: middle; dominant-baseline: central;
            paint-order: stroke; stroke: #fff; stroke-width: 2px; stroke-linejoin: round; pointer-events: none; }
  .ts-num.on { fill: var(--accent-edge); }
  .ts-line { stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; transition: stroke-dashoffset .25s ease-out; }
  .ts-art { opacity: 0; transition: opacity .7s ease; }
  .ts-art.on { opacity: 1; }

  /* ---------- めいろ ---------- */
  .mz-area { flex: 1 1 0; min-height: calc(var(--k) * 200px); display: flex; align-items: center; justify-content: center; padding-bottom: 14px; }
  .mz-svg { width: 100%; height: 100%; touch-action: none; }
  .mz-floor { fill: #fff8e8; }
  .mz-goalcell { fill: #ffe7c2; }
  /* 1マス＝10目盛り */
  .mz-wall { fill: none; stroke: #9a744c; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .mz-trail { fill: none; stroke: #9fdcbc; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .mz-emo { font-size: 6.4px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .mz-hero { transition: transform .09s linear; }
  .mz-hero text { transform-box: fill-box; transform-origin: center; }
  .mz-hero.yay text { animation: mz-hop .5s ease-in-out 3; }
  @keyframes mz-hop { 0%, 100% { translate: 0 0; } 45% { translate: 0 -3px; scale: 1.1; } }
  .mz-goal { transform-box: fill-box; transform-origin: center; animation: goal-wiggle 1.4s ease-in-out infinite; }
  @keyframes goal-wiggle { 0%, 100% { rotate: -8deg; } 50% { rotate: 8deg; } }

  /* ---------- ことばづくり ---------- */
  /* 大きい画面ほど大きく（--T：文字カード1まいの大きさ） */
  #kz-body { --T: min(calc(var(--k) * 112px), 13vh, 19vw); }
  .kz-pic { align-self: center; font-size: min(calc(var(--k) * 150px), 19vh); line-height: 1; margin: -6px 0 clamp(12px, 3vh, 26px); }
  .kz-pic.yay { animation: pick .6s ease; }
  .kz-row { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 2vw, 18px); }
  .kz-slots { margin-bottom: clamp(18px, 4.5vh, 40px); }
  .kz-slot, .kz-tile { width: var(--T); height: var(--T); border-radius: 20px; }
  .kz-slot { position: relative; border: 3px dashed #d8c9b2; background: rgba(255,255,255,.6); display: grid; place-items: center; }
  .kz-slot .ghost-ch { font-size: calc(var(--T) * .62); font-weight: 800; color: #e9e0d0; }
  .kz-tile {
    position: relative; border: none; padding: 0; cursor: pointer;
    font-family: inherit; font-size: calc(var(--T) * .62); font-weight: 800; color: var(--ink);
    background: linear-gradient(#fff3d6, #f6dfb0); box-shadow: 0 6px 0 #dcb97c, 0 10px 18px rgba(59,49,41,.1);
    transition: translate .3s ease;
  }
  .kz-tile.hint { box-shadow: 0 0 0 4px var(--warm), 0 6px 0 #dcb97c; }
  .kz-tile.shake { animation: shake .4s ease; }
  .kz-slot .kz-tile { position: absolute; left: -3px; top: -3px; cursor: default; box-shadow: 0 4px 0 #dcb97c; }
  .kz-slot .kz-tile.snap { animation: snap .4s ease .22s; }
  @keyframes shake { 20% { translate: -7px 0; } 40% { translate: 7px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }
  /* メニューの絵：文字の積み木 */
  .blk-ico { display: flex; gap: .08em; }
  .blk-ico b {
    width: 1.3em; height: 1.3em; display: grid; place-items: center; font-size: .42em; font-weight: 800;
    background: #f6dfb0; border-radius: .3em; box-shadow: 0 .12em 0 #dcb97c;
  }

  /* ---------- シール ---------- */
  .big-btn.stickers { --c1: #f1e7fd; --c2: #c9b0ea; }
  .stk-count { font-size: 1.3rem; font-weight: 800; color: var(--ink-soft); padding-right: 70px; }
  /* シールをはるページ：空と草原 */
  .stk-page {
    position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 30px;
    background:
      radial-gradient(56px 56px at 88% 16%, #ffe38a 0 60%, rgba(255,227,138,.35) 61%, transparent 100%),
      radial-gradient(80px 26px at 20% 18%, rgba(255,255,255,.95), transparent 70%),
      radial-gradient(110px 34px at 28% 22%, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(90px 28px at 62% 12%, rgba(255,255,255,.85), transparent 70%),
      radial-gradient(130% 60% at 25% 100%, #a8dc8f 0 55%, transparent 56%),
      radial-gradient(120% 55% at 90% 100%, #9bd382 0 55%, transparent 56%),
      linear-gradient(#cfe9fb, #eaf6f4 70%);
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.7), 0 10px 24px rgba(59,49,41,.06);
  }
  /* 白いふちどりのある、切りぬきシール（たくさん はっても重くならないよう、文字の影でふちどる） */
  .stk {
    position: absolute; font-size: calc(var(--k) * 64px); line-height: 1; cursor: grab; touch-action: none;
    transform: translate(-50%, -50%) rotate(var(--r, 0deg));
    text-shadow: 3px 0 #fff, -3px 0 #fff, 0 3px #fff, 0 -3px #fff, 2px 2px #fff, -2px 2px #fff, 2px -2px #fff, -2px -2px #fff,
                 0 5px 6px rgba(59,49,41,.22);
  }
  .stk.lift { z-index: 20; scale: 1.15; cursor: grabbing; }
  .stk.pop { animation: stk-pop .45s ease-out; }
  @keyframes stk-pop { 0% { scale: .3; } 60% { scale: 1.25; } 100% { scale: 1; } }
  .stk-tray {
    display: flex; flex-wrap: wrap; gap: 14px 18px; justify-content: center; align-content: flex-start;
    max-height: calc(var(--k) * 190px); overflow-y: auto; padding: 16px 8px 4px; min-height: calc(var(--k) * 90px);
  }
  .stk-tray .stk { position: relative; transform: rotate(var(--r, 0deg)); cursor: pointer; touch-action: manipulation; }
  .stk-tray .empty { padding: 10px; }
  /* おしまい画面で もらえるシール */
  .finish-sticker { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 800; color: var(--ink-soft); min-height: 1em; }
  .finish-sticker .stk { position: relative; transform: rotate(var(--r, 0deg)); animation: stk-pop .5s ease-out backwards; font-size: calc(var(--k) * 58px); cursor: default; }

  /* 動きを減らす設定の端末では、飾りの動きを止める */
  @media (prefers-reduced-motion: reduce) {
    .screen.on, .choice, .dot.just, .stars .dot, .bubble, .balloon, .pz-board.done,
    .logo span, .menu-card, .choice.right, .prompt.pop, .mascot, .tr-cursor,
    .pz-slot .pz-piece.snap, .sched-item .check.just,
    .mk-key.hit, .mk-key.next .mk-star, .baa-animal.show, .baa-cloth svg, .ts-dot.start, .ts-dot.hint, .ts-dot.nope,
    .mz-goal, .mz-hero.yay text, .kz-pic.yay, .kz-tile.shake, .kz-slot .kz-tile.snap, .stk.pop,
    .finish-sticker .stk { animation: none; }
    .balloon { transition: transform .25s ease, opacity .25s ease; }
    .spark, .fnote { display: none; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  /* ============ ストレージ ============ */
  // github.io では同じアカウントの他のページと保存領域を共有するので、名前に asobou_ を付けて区別する
  var KEY_LOG = "asobou_log_v1";
  var KEY_SCHED = "asobou_sched_v1";
  var KEY_SCHED_DONE = "asobou_sched_done_v1";
  var KEY_HIDDEN = "asobou_hidden_v1";
  var KEY_SOUND = "asobou_sound_v1";
  var KEY_MODE = "asobou_mode_v1";
  var KEY_VOICE = "asobou_voice_v1";       // よみあげ
  var KEY_STICKERS = "asobou_stickers_v1"; // もらったシール（はった場所も）
  var KEY_KNOWN = "asobou_known_v1";       // 前に開いたときにあった あそび（新しく増えたものを見分ける）

  // 以前の名前で保存した記録・スケジュールを引き継ぐ（元のデータは消さない）
  [["dev_log_v1", KEY_LOG], ["dev_sched_v1", KEY_SCHED], ["dev_sched_done_v1", KEY_SCHED_DONE]].forEach(function (p) {
    try {
      var old = localStorage.getItem(p[0]);
      if (old !== null && localStorage.getItem(p[1]) === null) localStorage.setItem(p[1], old);
    } catch (e) {}
  });

  // 形のおかしいデータ（壊れたもの）は使わず、初期値にする
  function load(k, fb) {
    try {
      var v = JSON.parse(localStorage.getItem(k));
      if (v !== null && typeof v === "object" && Array.isArray(v) === Array.isArray(fb)) return v;
    } catch (e) {}
    return fb;
  }
  function save(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }

  var log = load(KEY_LOG, []);
  var sched = load(KEY_SCHED, [
    { ico: "🌅", label: "おきる" },
    { ico: "🍚", label: "ごはん" },
    { ico: "👕", label: "きがえ" },
    { ico: "🚌", label: "えん" },
    { ico: "🏠", label: "おうち" },
    { ico: "🛁", label: "おふろ" },
    { ico: "🛏️", label: "ねる" }
  ]);
  var schedDone = load(KEY_SCHED_DONE, { date: "", done: [] });
  var hidden = load(KEY_HIDDEN, []); // 保護者メニューで「メニューに出さない」にした あそび
  // ちいさい子むけ：えらぶものを2つにして、パズルなどのピースも少なめにする
  var easy = load(KEY_MODE, { easy: false }).easy === true;
  // シール：{ e: 絵, on: ページにはったか, x・y: ページの中の位置（0〜1）, r: かたむき }
  var stickers = load(KEY_STICKERS, []).filter(function (s) {
    return s && typeof s.e === "string" && typeof s.x === "number" && typeof s.y === "number";
  });

  function newId() { return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  log = log.filter(function (r) { return r && typeof r.t === "number" && typeof r.task === "string"; });
  sched = sched.filter(function (it) { return it && typeof it.label === "string"; });

  // チェック済みは「何番目か」ではなく項目ごとの id で覚える（並べ替え・削除でずれないように）
  sched.forEach(function (it) { if (!it.id) it.id = newId(); });
  schedDone.done = (Array.isArray(schedDone.done) ? schedDone.done : []).map(function (x) {
    return typeof x === "number" ? sched[x] && sched[x].id : x; // 以前の形式（番号）を id に置き換え
  }).filter(Boolean);
  save(KEY_SCHED, sched);

  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  // 日付が変わっていたらチェックを外す。開きっぱなしでも翌日に戻るよう、読み込み時以外にも呼ぶ
  function ensureToday() {
    if (schedDone.date === today()) return false;
    schedDone = { date: today(), done: [] };
    save(KEY_SCHED_DONE, schedDone);
    return true;
  }
  ensureToday();
  save(KEY_SCHED_DONE, schedDone);

  /* ============ 音 ============ */
  // 音は端末の中で作る（音のファイルは使わないので、通信がなくても鳴る）。
  // やわらかく短い音だけ。まちがえたときの音は出さない。保護者メニューで切り替えられる
  var soundOn = load(KEY_SOUND, { on: true }).on !== false;
  var actx = null, master = null;

  function audioCtx() {
    if (!soundOn) return null;
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
      master = actx.createGain();
      master.gain.value = 0.25; // 全体を小さめに（端末の音量で調整してもらう）
      master.connect(actx.destination);
    }
    // iPad では画面を触ったときにしか音を出せないので、そのたびに起こす
    if (actx.state === "suspended") actx.resume();
    return actx;
  }

  // まるい音をひとつ鳴らす（at: 何秒あとに、to: その高さまで下げる）
  function beep(freq, dur, opt) {
    var ctx = audioCtx();
    if (!ctx) return;
    opt = opt || {};
    var t0 = ctx.currentTime + (opt.at || 0);
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = opt.type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (opt.to) o.frequency.exponentialRampToValueAtTime(opt.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(opt.vol || 0.4, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  var SOUNDS = {
    tap: function () { beep(523.25, .1, { type: "triangle", vol: .3 }); },
    right: function () { beep(659.25, .18, { vol: .5 }); beep(987.77, .32, { at: .09, vol: .4 }); },
    pop: function () { beep(880, .13, { to: 220, vol: .6 }); },                      // しゃぼんだま
    pop2: function () { beep(560, .15, { to: 150, type: "triangle", vol: .55 }); },  // ふうせん
    place: function () { beep(392, .12, { type: "triangle", vol: .5 }); beep(784, .09, { vol: .18 }); },
    soft: function () { beep(300, .1, { vol: .22 }); },                              // ピースが戻るとき（やわらかく短い）
    baa: function () { beep(523.25, .12, { type: "triangle", vol: .4 }); beep(783.99, .14, { at: .1, type: "triangle", vol: .4 }); beep(1046.5, .3, { at: .2, vol: .35 }); },
    peta: function () { beep(440, .07, { type: "triangle", vol: .35 }); beep(880, .12, { at: .05, vol: .2 }); }, // シールをはる
    step: function () { beep(620, .05, { type: "triangle", vol: .12 }); },          // めいろで1マス進む
    check: function () { beep(659.25, .12, { type: "triangle", vol: .4 }); beep(987.77, .2, { at: .08, vol: .3 }); },
    finish: function () {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        beep(f, .32, { at: i * .1, type: "triangle", vol: .4 });
      });
    }
  };
  function play(name) { if (SOUNDS[name]) SOUNDS[name](); }
  // なぞりで、進むほど高くなる音（ドレミソラ…）
  var SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];
  function note(i) { beep(SCALE[i % SCALE.length], .12, { type: "triangle", vol: .28 }); }
  // もっきんの音：やわらかく長めに響く音に、すぐ消える高い音を重ねて、木をたたいた感じにする
  function mallet(f, at) {
    beep(f, .9, { vol: .5, at: at || 0 });
    beep(f * 3.99, .2, { vol: .09, at: at || 0 });
  }

  /* ============ よみあげ ============ */
  // お題などを端末の声で読む（iPad の日本語の声）。保護者メニューで切り替えられる。初めは読む
  var voiceOn = load(KEY_VOICE, { on: true }).on !== false;
  var jaVoice = null;
  var synth = window.speechSynthesis || null;
  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices().filter(function (v) { return /^ja/i.test(v.lang); });
    // なるべく聞きやすい声（iPad の Kyoko・O-ren など）を選ぶ。なければ最初の日本語の声
    jaVoice = vs.filter(function (v) { return /kyoko|o-ren|otoya|haruka|nanami|google/i.test(v.name); })[0] || vs[0] || null;
  }
  if (synth) {
    pickVoice();
    try { synth.addEventListener("voiceschanged", pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; }
  }
  var sayTimer = null;
  function say(text) {
    if (!voiceOn || !synth || !window.SpeechSynthesisUtterance || !text) return;
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      if (jaVoice) u.voice = jaVoice;
      u.rate = .9;
      u.pitch = 1.1;
      // 読んでいる途中なら止めて、いちばん新しいものだけを読む（数字が つぎつぎ続いても順番が入れかわらない）。
      // iPad は止めた直後に読ませると聞こえないことがあるので、そのときだけ少し待つ
      var busy = sayTimer !== null || synth.speaking || synth.pending;
      clearTimeout(sayTimer);
      sayTimer = null;
      if (synth.speaking || synth.pending) synth.cancel();
      if (!busy) { synth.speak(u); return; }
      sayTimer = setTimeout(function () { sayTimer = null; synth.speak(u); }, 80);
    } catch (e) {}
  }
  function hush() {
    clearTimeout(sayTimer);
    sayTimer = null;
    try { if (synth && (synth.speaking || synth.pending)) synth.cancel(); } catch (e) {}
  }
  // お題の白いラベルをタッチすると、もう一度読む
  document.addEventListener("click", function (e) {
    var p = e.target.closest && e.target.closest(".prompt");
    if (p) say(p.getAttribute("data-say") || p.textContent);
  });

  /* ============ 画面遷移 ============ */
  var current = "home";
  var timers = [];
  // 画面を切り替えたら、前の画面で予約していた処理（次の問題へ進む など）は取り消す
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function go(name) {
    timers.forEach(clearTimeout);
    timers = [];
    hush(); // 前の画面で読んでいた声は止める
    current = name;
    var ids = {
      home: "s-home", menu: "s-menu", task: "s-task", puzzle: "s-puzzle", pop: "s-pop",
      memory: "s-memory", trace: "s-trace", draw: "s-draw",
      mokkin: "s-mokkin", baa: "s-baa", nurie: "s-nurie", tentsu: "s-tentsu", maze: "s-maze", word: "s-word",
      stickers: "s-stickers", finish: "s-finish", sched: "s-sched", parent: "s-parent"
    };
    Object.keys(ids).forEach(function (k) {
      document.getElementById(ids[k]).classList.toggle("on", k === name);
    });
    if (name === "menu") renderMenu();
    if (name === "sched") renderSched();
    if (name === "parent") renderParent();
    if (name === "stickers") renderStickers();
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go]");
    if (t) { play("tap"); go(t.getAttribute("data-go")); }
  });

  /* ============ 課題の定義 ============ */
  // 共通ルール：問いかけない／2語文／時間制限なし／減点なし

  var FRUITS = ["🍎", "🍊", "🍌", "🍇", "🍓", "🍑"];
  var INSECTS = ["🐛", "🦋", "🐝", "🐞", "🦗", "🕷️"];
  var VEG = ["🥕", "🥔", "🧅", "🍅", "🌽", "🥒"];
  var TOYS = ["🚗", "⚽", "🧸", "🪁", "🎈", "🪀"];

    if (easy && !T.noEasy && q.choices.length > 2) {
      var drop = q.choices.filter(function (c) { return c.key !== q.answer; })[0];
      q.choices = q.choices.filter(function (c) { return c !== drop; });
    }
    // 正解の場所も、3回続けて同じにならないように並べ直す（場所だけで選べてしまわないように）
    n = 0;
    while (n++ < 30 && repeated(h.p, answerPos(q), 2)) q.choices = shuffle(q.choices);
    h.t = h.t.concat(targetOf(q)).slice(-2);
    h.p = h.p.concat(answerPos(q)).slice(-2);
    cur.q = q;
    cur.tries = 0;
    cur.locked = false;
    drawDots("dots", ROUND, cur.i);
    document.getElementById("task-body").scrollTop = 0;
    var pr = document.getElementById("prompt");
    pr.textContent = cur.q.prompt;
    pr.classList.remove("pop");
    void pr.offsetWidth; // いったん外してから付け直して、毎回はずませる
    pr.classList.add("pop");
    say(cur.q.prompt);
    var sample = document.getElementById("sample");
    sample.classList.toggle("on", !!cur.q.sample);
    sample.innerHTML = cur.q.sample ? faceHTML(cur.q.sample) : "";
    var box = document.getElementById("choices");
    box.innerHTML = "";
    cur.q.choices.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "choice";
      b.setAttribute("data-key", c.key);
      b.innerHTML = faceHTML(c);
      b.addEventListener("click", function () { answer(b, c.key); });
      box.appendChild(b);
    });
  }

  function targetOf(q) { return q.prompt + (q.sample ? " " + q.sample.emo : ""); }
  function answerPos(q) {
    for (var i = 0; i < q.choices.length; i++) if (q.choices[i].key === q.answer) return i;
    return -1;
  }
  // 直前の limit 回がすべて v なら true（v をもう一度出すと limit+1 回続いてしまう）
  function repeated(hist, v, limit) {
    if (hist.length < limit) return false;
    for (var i = hist.length - limit; i < hist.length; i++) if (hist[i] !== v) return false;
    return true;
  }

  // 選択肢・見本の中身（絵文字／いくつかのまとまり／色／かたち）
  function faceHTML(c) {
    if (c.seq) {
      // パターン：ならんでいるものと、最後の「?」
      return '<span class="seq">' + c.seq.map(function (x) {
        return '<span class="seq-item">' + faceHTML(x) + '</span>';
      }).join("") + '<span class="seq-item seq-q">?</span></span>';
    }
    if (c.group) {
      // 4こは2+2、5こは3+2、6こは3+3 に並べて、いくつあるかを一目で見やすくする（端末の文字幅に左右されない）
      var rows = c.group === 6 ? [3, 3] : c.group === 5 ? [3, 2] : c.group === 4 ? [2, 2] : [c.group];
      var fs = c.group > 3 ? 48 : 60;
      return '<span class="group-box">' + rows.map(function (n) {
        var row = "";
        for (var i = 0; i < n; i++) row += '<span class="emo" style="font-size:calc(var(--k) * ' + fs + 'px)">' + c.emo + '</span>';
        return '<span class="group-row">' + row + '</span>';
      }).join("") + '</span>';
    }
    if (c.color) return '<span class="swatch" style="background-color:' + c.color + '"></span>';
    if (c.shape) return '<svg class="shape" viewBox="0 0 100 100" aria-hidden="true">' + c.shape + '</svg>';
    return '<span class="emo' + (c.sil ? " sil" : "") + '" style="font-size:calc(var(--k) * ' + (c.size || 110) + 'px)">' + c.emo + '</span>';
  }

  function drawDots(id, total, done) {
    var d = document.getElementById(id);
    d.innerHTML = "";
    for (var i = 0; i < total; i++) {
      var s = document.createElement("span");
      // いま増えた星だけ、ぽんと はずませる
      s.className = "dot" + (i < done ? " done" : "") + (i === done - 1 ? " just" : "");
      d.appendChild(s);
    }
  }

  function answer(el, key) {
    // 正解のあと次の問題に移るまでは受け付けない（連打で2回記録されて1問とばないように）
    if (cur.locked) return;
    var ok = key === cur.q.answer;
    if (!ok) {
      // 減点なし・バツなし。静かに選べなくなるだけ
      cur.tries++;
      el.classList.add("dim");
      // 2回目を選ぶときに足場を出す（正解の枠をそっと示す）。
      // 3択で2回外すまで待つと、その時点で正解しか残っていないため1回目で出す
      var right = document.querySelector('.choice[data-key="' + cur.q.answer + '"]');
      if (right) right.classList.add("hint");
      return;
    }
    cur.locked = true;
    el.classList.add("right");
    burst(el, 10);
    play("right");
    record(cur.key, cur.tries === 0);
    later(function () { cur.i++; nextQ(); }, 700);
  }

  function record(task, firstTry) {
    log.push({ t: Date.now(), task: task, first: firstTry ? 1 : 0 });
    if (log.length > 3000) log = log.slice(-3000);
    save(KEY_LOG, log);
  }

  // おしまい画面。やった数だけ星がならぶ（正解の数ではなく、やりきった数）。
  // 最後までやると、シールが1まいもらえる（noSticker：おえかきで何もかかずに「できた」を押したときなど）
  var MASCOTS = ["🐻", "🐰", "🐱", "🐶", "🐼", "🐯", "🦊", "🐥", "🐧", "🐸"];
  var lastMascot = null;
  function finish(n, noSticker) {
    var m;
    do { m = pick(MASCOTS); } while (m === lastMascot); // 毎回ちがう子が出てくる
    lastMascot = m;
    document.getElementById("finish-mascot").textContent = m;
    play("finish");
    var box = document.getElementById("finish-stars");
    box.innerHTML = "";
    box.classList.toggle("many", n > 5);
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      s.className = "dot done";
      s.style.animationDelay = (0.15 + i * 0.12).toFixed(2) + "s";
      box.appendChild(s);
    }
    var gift = noSticker ? null : giveSticker();
    document.getElementById("finish-sticker").innerHTML = gift
      ? '<span class="stk" style="--r:' + gift.r + 'deg;animation-delay:' + (0.3 + n * 0.12).toFixed(2) + 's">' + gift.e + '</span>シール ゲット'
      : "";
    go("finish");
    say("おしまい");
  }

  // 正解・完成・割れたときの、小さな粒（音なし・0.7秒で消える）
  var SPARK = ["#ffc93c", "#ff8fa3", "#7cc6ff", "#8ee0a1", "#c9a7ff"];
  function burst(el, n, colors) {
    var r = el.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var dist = Math.max(r.width, r.height) / 2 + 24;
    colors = colors || SPARK;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      var a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
      var d = dist * (0.8 + Math.random() * 0.4);
      s.className = "spark" + (i % 3 === 0 ? " star" : "");
      s.style.left = cx + "px";
      s.style.top = cy + "px";
      s.style.background = colors[i % colors.length];
      s.style.setProperty("--dx", (Math.cos(a) * d).toFixed(1) + "px");
      s.style.setProperty("--dy", (Math.sin(a) * d).toFixed(1) + "px");
      document.body.appendChild(s);
      setTimeout(s.remove.bind(s), 800);
    }
  }

  /* ============ しゃぼんだま・ふうせん（自由あそび・記録なし） ============ */
  // 逃げない・消えない・時間制限なし。決まった数を割ったらおしまい
  var POPS = 8;
  var HUES = [200, 170, 130, 20, 330, 280]; // しゃぼんだま：背景に溶けやすい うすい黄色は使わない
  var BALLOON_COLORS = ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e44ad", "#f06292"];
  var BALLOON_SVG = '<svg viewBox="0 0 100 160" aria-hidden="true">' +
    '<path class="b-string" d="M50 110 C 43 124 57 136 48 156"/>' +
    '<path class="b-knot" d="M43 111 L57 111 L50 101 Z"/>' +
    '<path class="b-body" d="M50 4 C 22 4 7 27 7 52 C 7 80 29 100 50 105 C 71 100 93 80 93 52 C 93 27 78 4 50 4 Z"/>' +
    '<path class="b-shade" d="M50 105 C 71 100 93 80 93 52 C 93 38 88 26 80 18 C 84 30 84 44 80 58 C 73 82 60 96 50 105 Z"/>' +
    '<ellipse class="b-shine" cx="33" cy="32" rx="8" ry="15" transform="rotate(-25 33 32)"/></svg>';
  var game = null;

  function startPop(kind) {
    go("pop");
    // 色は袋から順に出す（同じ色ばかり続かないように）
    game = { kind: kind, popped: 0, spawned: 0, colors: shuffle(kind === "balloon" ? BALLOON_COLORS : HUES) };
    document.getElementById("pond").innerHTML = "";
    drawDots("pop-dots", POPS, 0);
    for (var i = 0; i < 3; i++) spawnPop();
  }

  function spawnPop() {
    if (!game || game.spawned >= POPS) return;
    var pond = document.getElementById("pond");
    var W = pond.clientWidth, H = pond.clientHeight;
    var balloon = game.kind === "balloon";
    var w = balloon ? Math.max(76, Math.min(150, Math.round(Math.min(W, H) * 0.24)))
                    : Math.max(90, Math.min(170, Math.round(Math.min(W, H) * 0.3)));
    var h = balloon ? Math.round(w * 1.6) : w;
    var spot = freeSpot(pond, w, h);
    var color = game.colors[game.spawned % game.colors.length];
    game.spawned++;
    var b = document.createElement("button");
    b.className = "popper " + game.kind;
    b.setAttribute("aria-label", balloon ? "ふうせん" : "しゃぼんだま");
    b.style.width = w + "px";
    b.style.height = h + "px";
    b.style.left = spot.x + "px";
    b.style.animationDelay = -(Math.random() * 3).toFixed(2) + "s";
    b._x = spot.x;
    b._y = spot.y;
    if (balloon) {
      b.style.setProperty("--c", color);
      b.innerHTML = BALLOON_SVG;
      b.style.top = (H + 10) + "px"; // 下の見えない所から、ふわっと上がってくる
    } else {
      b.style.setProperty("--h", color);
      b.style.top = spot.y + "px";
      b.classList.add("new");
    }
    // 指が触れた瞬間に割れるよう pointerdown。キーボード操作用に click も受ける
    b.addEventListener("pointerdown", function () { popIt(b); });
    b.addEventListener("click", function () { popIt(b); });
    pond.appendChild(b);
    void b.offsetWidth; // 一度配置を確定させてから動かす
    if (balloon) b.style.top = spot.y + "px"; else b.classList.remove("new");
  }

  // ほかと重ならない場所をさがす（見つからなければ一番すいている所）。位置は行き先（_x, _y）でくらべる
  function freeSpot(pond, w, h) {
    var W = pond.clientWidth, H = pond.clientHeight;
    var others = Array.prototype.filter.call(pond.children, function (o) { return !o.classList.contains("pop"); });
    var best = null, bestGap = -Infinity;
    for (var t = 0; t < 40; t++) {
      var x = 12 + Math.random() * Math.max(0, W - w - 24);
      var y = 16 + Math.random() * Math.max(0, H - h - 32);
      var gap = Infinity;
      others.forEach(function (o) {
        var ow = o.offsetWidth, oh = o.offsetHeight;
        var dx = (o._x + ow / 2) - (x + w / 2), dy = (o._y + oh / 2) - (y + h / 2);
        gap = Math.min(gap, Math.sqrt(dx * dx + dy * dy) - (Math.max(ow, oh) + Math.max(w, h)) / 2 * 0.8);
      });
      if (gap > bestGap) { bestGap = gap; best = { x: x, y: y }; }
      if (gap > 12) break;
    }
    return best;
  }

  function popIt(b) {
    if (!game || b.classList.contains("pop")) return;
    var balloon = game.kind === "balloon";
    b.classList.add("pop");
    if (balloon) {
      var c = b.style.getPropertyValue("--c");
      burst(b.querySelector(".b-body"), 10, [c, "#ffd766", c, "#ffffff"]);
    } else {
      burst(b, 8);
    }
    play(balloon ? "pop2" : "pop");
    game.popped++;
    drawDots("pop-dots", POPS, game.popped);
    later(function () { b.remove(); }, 320);
    if (game.popped >= POPS) later(function () { finish(POPS); }, 900);
    else later(spawnPop, 450);
  }

  // 画面の向きが変わっても、見える範囲に収まるように
  window.addEventListener("resize", function () {
    if (current !== "pop") return;
    var pond = document.getElementById("pond");
    Array.prototype.forEach.call(pond.children, function (b) {
      b._x = Math.max(0, Math.min(b._x, pond.clientWidth - b.offsetWidth - 12));
      b._y = Math.max(0, Math.min(b._y, pond.clientHeight - b.offsetHeight - 16));
      b.style.left = b._x + "px";
      b.style.top = b._y + "px";
    });
  });

  /* ============ パズル（かたちはめ・えあわせ） ============ */
  // ちがう場所に置くとピースが戻るだけ（×なし）。1回まちがえると、そのピースと正しい場所に枠が出る。
  // 指で動かすほか、「ピースをタップ → 置く場所をタップ」でも置ける。1回3つで、ピースは 2→3→4 と増える
  var SHAPE_COLORS = { "まる": "#e0533f", "さんかく": "#f3c21b", "しかく": "#3b7dd8", "ほし": "#3f9f5a", "ハート": "#ec6f9e" };
  // えあわせ：顔は左右がほぼ同じ形で取り違えやすいので、横長の帯（耳・目・口…）に分けて上から並べる
  var FACES = [
    { w: "いぬ", e: "🐶" }, { w: "ねこ", e: "🐱" }, { w: "パンダ", e: "🐼" }, { w: "かえる", e: "🐸" },
    { w: "くま", e: "🐻" }, { w: "ぶた", e: "🐷" }, { w: "うさぎ", e: "🐰" }, { w: "ライオン", e: "🦁" },
    { w: "とら", e: "🐯" }, { w: "さる", e: "🐵" }, { w: "コアラ", e: "🐨" }, { w: "うし", e: "🐮" }
  ];

  var PUZZLES = {
    hame: {
      ico: '<svg class="ico-svg" viewBox="0 0 100 100" aria-hidden="true">' +
           '<rect x="4" y="34" width="92" height="60" rx="12" fill="#e3c99c"/>' +
           '<circle cx="30" cy="64" r="17" fill="#e0533f"/><polygon points="70,49 87,79 53,79" fill="#b9955f"/>' +
           '<polygon points="70,4 88,36 52,36" fill="#f3c21b"/></svg>',
      label: "かたちはめ", sizes: [2, 3, 4], easySizes: [2, 2, 3], build: buildHame
    },
    eawase: { ico: "🧩", label: "えあわせ", sizes: [2, 3, 4], easySizes: [2, 2, 3], build: buildEawase }
  };

  var pz = null;       // いま遊んでいるパズル
  var drag = null;     // 指で動かしているピース
  var selected = null; // タップで選んだピース

  function startPuzzle(key) {
    go("puzzle");
    pz = { key: key, i: 0 };
    nextPuzzle();
  }

  function nextPuzzle() {
    var P = PUZZLES[pz.key];
    var sizes = (easy && P.easySizes) || P.sizes;
    if (pz.i >= sizes.length) { finish(sizes.length); return; }
    drag = null;
    selected = null;
    pz.mistakes = 0;
    pz.locked = false;
    drawDots("pz-dots", sizes.length, pz.i);
    var q = P.build(sizes[pz.i]);
    pz.left = sizes[pz.i];
    document.getElementById("pz-body").scrollTop = 0;
    document.getElementById("pz-prompt").textContent = q.prompt;
    say(q.prompt);
    var area = document.getElementById("pz-area");
    area.innerHTML = "";
    area.appendChild(q.board);
    area.appendChild(q.tray);
    Array.prototype.forEach.call(area.querySelectorAll(".pz-piece"), function (p) {
      p.addEventListener("pointerdown", pieceDown);
      p.addEventListener("pointermove", pieceMove);
      p.addEventListener("pointerup", pieceUp);
      p.addEventListener("pointercancel", pieceCancel);
    });
    Array.prototype.forEach.call(area.querySelectorAll(".pz-slot"), function (s) {
      s.addEventListener("click", function () { if (selected) tryPlace(selected, s); });
    });
  }

  function el(tag, cls) {
    var e = document.createElement(tag);
    e.className = cls;
    return e;
  }
  // 混ぜる。ただし正解と同じ並びにはしない（そのまま横にずらすだけ、にならないように）
  function mixed(items) {
    var sh = shuffle(items);
    if (items.length > 1 && sh.every(function (x, i) { return x === items[i]; })) sh.push(sh.shift());
    return sh;
  }
  function shapeSVG(s, cls, fill) {
    return '<svg class="' + cls + '" viewBox="0 0 100 100" aria-hidden="true"' +
           (fill ? ' style="fill:' + fill + '"' : "") + '>' + s.svg + '</svg>';
  }

  function buildHame(n) {
    var shapes = shuffle(SHAPES).slice(0, n);
    var board = el("div", "pz-board hame");
    var tray = el("div", "pz-tray");
    board.style.gridTemplateColumns = tray.style.gridTemplateColumns = "repeat(" + (n === 4 ? 2 : n) + ", auto)";
    shapes.forEach(function (s) {
      var slot = el("div", "pz-slot");
      slot.setAttribute("data-id", s.name);
      slot.innerHTML = shapeSVG(s, "hole");
      board.appendChild(slot);
    });
    mixed(shapes).forEach(function (s) {
      var cell = el("div", "pz-cell shape");
      var p = el("div", "pz-piece shape");
      p.setAttribute("data-id", s.name);
      p.innerHTML = shapeSVG(s, "", SHAPE_COLORS[s.name]);
      cell.appendChild(p);
      tray.appendChild(cell);
    });
    return { prompt: "かたち はめて", board: board, tray: tray };
  }

  var lastFace = null;
  function buildEawase(n) {
    var f;
    do { f = pick(FACES); } while (f === lastFace); // 同じどうぶつが続かないように
    lastFace = f;
    var rows = [];
    for (var r = 0; r < n; r++) rows.push(r);
    var board = el("div", "pz-board frame");
    var grid = el("div", "pz-grid");
    grid.style.gridTemplateRows = "repeat(" + n + ", 1fr)";
    grid.innerHTML = '<div class="pic ghost">' + f.e + '</div>'; // うすい見本
    rows.forEach(function (r) {
      var slot = el("div", "pz-slot");
      slot.setAttribute("data-id", r);
      grid.appendChild(slot);
    });
    board.appendChild(grid);
    var tray = el("div", "pz-tray strips");
    mixed(rows).forEach(function (r) {
      var cell = el("div", "pz-cell strip");
      var p = el("div", "pz-piece strip");
      p.setAttribute("data-id", r);
      p.style.setProperty("--r", r);
      p.innerHTML = '<div class="pic">' + f.e + '</div>';
      cell.appendChild(p);
      tray.appendChild(cell);
    });
    board.style.setProperty("--n", n);
    tray.style.setProperty("--n", n);
    return { prompt: f.w + " つくって", board: board, tray: tray };
  }

  function select(p) {
    if (selected) selected.classList.remove("sel");
    selected = p;
    if (p) p.classList.add("sel");
  }

  function pieceDown(e) {
    var p = e.currentTarget;
    if (!pz || pz.locked || drag || p.parentNode.classList.contains("pz-slot")) return;
    e.preventDefault();
    drag = { piece: p, id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false };
    try { p.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function pieceMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved) {
      if (Math.abs(dx) + Math.abs(dy) < 12) return; // 指の小さなぶれはタップとして扱う
      drag.moved = true;
      select(null);
      drag.piece.classList.add("lift");
    }
    drag.piece.style.transition = "none";
    drag.piece.style.translate = dx + "px " + dy + "px";
  }
  function pieceUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag;
    drag = null;
    if (!d.moved) { select(selected === d.piece ? null : d.piece); return; } // タップ＝ピースを選ぶ
    d.piece.classList.remove("lift");
    var slot = slotNear(d.piece);
    if (slot) tryPlace(d.piece, slot); else goHome(d.piece);
  }
  function pieceCancel(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.piece.classList.remove("lift");
    goHome(drag.piece);
    drag = null;
  }

  // 置いた位置にいちばん近い空きの場所（近くになければ null）。小さい子の手でも入るよう広めに判定する
  function slotNear(piece) {
    var r = piece.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var best = null, bestD = Infinity;
    Array.prototype.forEach.call(document.querySelectorAll("#pz-area .pz-slot:not(.filled)"), function (s) {
      var q = s.getBoundingClientRect();
      var d = Math.hypot(q.left + q.width / 2 - cx, q.top + q.height / 2 - cy);
      if (d < bestD && d < Math.max(q.width, q.height) * 0.6) { best = s; bestD = d; }
    });
    return best;
  }

  function tryPlace(piece, slot) {
    if (pz.locked || slot.classList.contains("filled")) return;
    select(null);
    if (slot.getAttribute("data-id") !== piece.getAttribute("data-id")) {
      // ちがう場所：ピースが戻るだけ。そのピースと正しい場所に、そっと枠を出す
      pz.mistakes++;
      play("soft");
      goHome(piece);
      piece.classList.add("hint");
      var right = document.querySelector('#pz-area .pz-slot[data-id="' + piece.getAttribute("data-id") + '"]');
      if (right) right.classList.add("hint");
      return;
    }
    piece.classList.remove("hint");
    slot.classList.remove("hint");
    slot.classList.add("filled");
    play("place");
    flipInto(piece, slot);
    piece.classList.add("snap");
    if (--pz.left === 0) finishPuzzle();
  }

  // いま見えている位置から、はまる場所まですべらせて移す
  function flipInto(piece, slot) {
    var a = piece.getBoundingClientRect();
    slot.appendChild(piece);
    piece.style.transition = "none";
    piece.style.translate = "0px 0px";
    var b = piece.getBoundingClientRect();
    piece.style.translate = (a.left - b.left) + "px " + (a.top - b.top) + "px";
    void piece.offsetWidth;
    piece.style.transition = "translate .25s ease";
    piece.style.translate = "0px 0px";
  }

  function goHome(piece) {
    piece.style.transition = "translate .3s ease, scale .15s ease";
    piece.style.translate = "0px 0px";
  }

  function finishPuzzle() {
    pz.locked = true;
    var board = document.querySelector("#pz-area .pz-board");
    board.classList.add("done");
    burst(board, 14);
    record(pz.key, pz.mistakes === 0);
    later(function () { pz.i++; nextPuzzle(); }, 1200);
  }

  /* --- きおく（同じ絵を2枚さがす） --- */
  var mem = null;

  function startMemory() {
    go("memory");
    mem = { i: 0 };
    nextMemory();
  }

  function nextMemory() {
    var sizes = (easy && GAMES.memory.easySizes) || GAMES.memory.sizes;
    if (mem.i >= sizes.length) { finish(sizes.length); return; }
    var pairs = sizes[mem.i];
    mem.open = [];
    mem.left = pairs;
    mem.mistakes = 0;
    mem.lock = false;
    drawDots("mem-dots", sizes.length, mem.i);
    say("おなじ さがして");
    var area = document.getElementById("mem-area");
    area.innerHTML = "";
    area.style.gridTemplateColumns = "repeat(" + (pairs >= 4 ? 4 : pairs === 3 ? 3 : 2) + ", auto)";
    var kinds = shuffle(POOL).slice(0, pairs);
    shuffle(kinds.concat(kinds)).forEach(function (e) {
      var c = el("button", "mem-card");
      c.setAttribute("data-id", e);
      c.innerHTML = '<span class="mem-inner"><span class="mem-face back">⭐</span>' +
                    '<span class="mem-face front">' + e + '</span></span>';
      c.addEventListener("click", function () { flipCard(c); });
      area.appendChild(c);
    });
  }

  function flipCard(c) {
    if (!mem || mem.lock || c.classList.contains("open") || c.classList.contains("done")) return;
    c.classList.add("open");
    play("tap");
    mem.open.push(c);
    if (mem.open.length < 2) return;
    var a = mem.open[0], b = mem.open[1];
    mem.open = [];
    if (a.getAttribute("data-id") === b.getAttribute("data-id")) {
      mem.left--;
      play("right");
      later(function () {
        a.classList.add("done");
        b.classList.add("done");
        burst(a, 6);
        burst(b, 6);
        if (mem.left === 0) {
          mem.lock = true;
          record("memory", mem.mistakes === 0);
          later(function () { mem.i++; nextMemory(); }, 1100);
        }
      }, 280);
    } else {
      // そろわなかったら、そっと裏に戻るだけ（音もバツも出さない）
      mem.mistakes++;
      mem.lock = true;
      later(function () {
        a.classList.remove("open");
        b.classList.remove("open");
        mem.lock = false;
      }, 950);
    }
  }

  var TRACE_ROUNDS = 3;

  function startTrace(kind) {
    go("trace");
    tr = { kind: kind, i: 0 };
    if (kind === "shape") {
      // やさしい→ふつう→むずかしい の順に3つ
      tr.items = [pick(TRACE_EASY), pick(TRACE_MID), pick(TRACE_HARD)].map(function (d) { return { strokes: [d] }; });
    } else {
      // 文字：五十音の並びで となり合う3文字（「あ・い・う」のように まとめて練習できる）
      var list = LETTERS[kind];
      var s = Math.floor(Math.random() * list.length);

    }

  function nextTrace() {
    if (tr.i >= TRACE_ROUNDS) { finish(TRACE_ROUNDS); return; }
    drawDots("tr-dots", TRACE_ROUNDS, tr.i);
    var item = tr.items[tr.i];
    document.getElementById("tr-prompt").textContent = item.ch ? item.ch + " なぞって" : "ゆびで なぞって";
    say(document.getElementById("tr-prompt").textContent);
    var lines = function (cls) {
      return item.strokes.map(function (d) { return '<path class="' + cls + '" d="' + d + '"/>'; }).join("");
    };
    var marks = '<circle class="tr-goal" r="4.5"/><circle class="tr-cursor" r="6"/>';
    var area = document.getElementById("trace-area");
    if (item.ch) {
      // うすい字の上に、太い線（いまの画＝少し濃い色／なぞったところ＝緑）を重ね、字の形で切りぬく（clip-path）。
      // 見えるのはフォントの字の形だけなので、線と字が二重に見えることはない
      var glyph = function (cls) { return '<text class="tr-glyph ' + cls + '">' + esc(item.ch) + '</text>'; };
      area.innerHTML =
        '<svg class="trace-svg on-letter" viewBox="' + LETTER_VB + '" preserveAspectRatio="xMidYMid meet">' +
        '<defs><clipPath id="tr-clip">' + glyph("") + '</clipPath></defs>' +
        glyph("g-base") +
        '<g clip-path="url(#tr-clip)">' + lines("tr-now") + lines("tr-done") + '</g>' +
        lines("tr-track") + marks + '</svg>';
    } else {
      area.innerHTML =
        '<svg class="trace-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">' +
        lines("tr-track") + lines("tr-done") + marks + '</svg>';
    }
    tr.svg = area.querySelector("svg");
    if (item.ch) placeGlyph(tr.svg, item.ch);
    // まだ なぞっていない画は、緑を隠しておく（すき間を長めにして、線の端に丸い点が出ないようにする）
    Array.prototype.forEach.call(tr.svg.querySelectorAll(".tr-done"), function (p) {
      var l = p.getTotalLength();
      p.style.strokeDasharray = l + " " + (l + 50);
      p.style.strokeDashoffset = l;
    });
    tr.cursor = tr.svg.querySelector(".tr-cursor");
    tr.s = 0;        // いま なぞっている線（ひらがなは何本かある）
    tr.locked = false;
    setupStroke();
    tr.svg.addEventListener("pointerdown", traceMove);
    tr.svg.addEventListener("pointermove", traceMove);

  // フォントの字を実際に測って、枠（LETTER_BOX）の真ん中に、はみ出さない大きさで置く。
  // なぞる線は、この置き方をした M PLUS Rounded 1c の字に合わせて作ってある
  function placeGlyph(svg, ch) {
    try {
      var ctx = document.createElement("canvas").getContext("2d");
      ctx.font = "800 100px " + getComputedStyle(document.body).fontFamily;
      var m = ctx.measureText(ch);
      var w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
      var h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      if (!(w > 0 && h > 0)) return;
      var b = LETTER_BOX;
      var s = Math.min(b.w / w, b.h / h);
      Array.prototype.forEach.call(svg.querySelectorAll(".tr-glyph"), function (t) {
        t.setAttribute("x", (b.x + (b.w - w * s) / 2 + m.actualBoundingBoxLeft * s).toFixed(2));
        t.setAttribute("y", (b.y + (b.h - h * s) / 2 + m.actualBoundingBoxAscent * s).toFixed(2));
        t.setAttribute("font-size", (100 * s).toFixed(2));
      });
    } catch (e) {}
  }

  // いまなぞる線に、通過する点をならべる（そこを通ると線がのびる）
  function setupStroke() {
    var tracks = tr.svg.querySelectorAll(".tr-track");
    Array.prototype.forEach.call(tracks, function (t, i) {
      t.classList.toggle("now", i === tr.s);  // いま なぞる線
      t.classList.toggle("later", i > tr.s);  // まだ なぞらない線は うすく
    });
    // 文字：いまなぞる画の字を少し濃く見せる
    Array.prototype.forEach.call(tr.svg.querySelectorAll(".tr-now"), function (t, i) {
      t.classList.toggle("on", i === tr.s);
    });
    var track = tracks[tr.s];
    var len = track.getTotalLength();
    var n = Math.max(6, Math.min(18, Math.round(len / 14)));
    var pts = [];
    for (var i = 0; i <= n; i++) pts.push(track.getPointAtLength(len * i / n));
    tr.doneEl = tr.svg.querySelectorAll(".tr-done")[tr.s];
    tr.track = track;
    tr.pts = pts;
    tr.len = len;
    tr.n = n;
    tr.at = 0;
    var goal = tr.svg.querySelector(".tr-goal");
    goal.setAttribute("cx", pts[n].x);
    goal.setAttribute("cy", pts[n].y);
    moveCursor();
  }

  function moveCursor() {
    var p = tr.pts[Math.min(tr.at + 1, tr.n)];
    tr.cursor.setAttribute("cx", p.x);
    tr.cursor.setAttribute("cy", p.y);
  }

  // ゆびが次の点に近づいたら、そこまで線がのびる（少しずれても進むので、小さい子でもできる）
  function traceMove(e) {
    if (!tr || tr.locked) return;
    if (e.type === "pointermove" && e.pointerType === "mouse" && !e.buttons) return;
    e.preventDefault();
    var m = (tr.track || tr.svg).getScreenCTM();
    if (!m) return;
    var pt = tr.svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    var p = pt.matrixTransform(m.inverse()); // 線と同じ座標系に直す
    var next = tr.pts[tr.at + 1];
    if (!next) return;
    var dx = p.x - next.x, dy = p.y - next.y;
    if (Math.sqrt(dx * dx + dy * dy) > 11) return;
    tr.at++;
    tr.doneEl.style.strokeDashoffset = tr.len * (1 - tr.at / tr.n);
    note(tr.at - 1); // 進むほど音が高くなる
    moveCursor();
    if (tr.at < tr.n) return;
    if (tr.s + 1 < tr.items[tr.i].strokes.length) {
      // 次の画へ（ひらがな）
      tr.s++;
      play("place");
      setupStroke();
      return;
    }
    tr.locked = true;
    // 文字：最後まで なぞれたら、字をまるごと緑にする（ぬり残しが小さく出ないように）
    tr.svg.classList.add("whole");
    burst(tr.cursor, 12);
    play("right");
    later(function () { tr.i++; nextTrace(); }, 1100);
  }

  // 画面の大きさに合わせる。向きを変えても、描いた絵は残す
  function fitCanvas(keep) {
    var cv = draw.cv;
    var r = cv.parentNode.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var old = keep && cv.width ? cv.toDataURL() : null;
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    cv.style.width = r.width + "px";
    cv.style.height = r.height + "px";
    var ctx = draw.ctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 14;
    if (old) {
      var img = new Image();
      img.onload = function () { ctx.drawImage(img, 0, 0, r.width, r.height); };
      img.src = old;
    }
  }

  function clearDraw() {
    draw.ctx.save();
    draw.ctx.setTransform(1, 0, 0, 1, 0, 0);
    draw.ctx.clearRect(0, 0, draw.cv.width, draw.cv.height);
    draw.ctx.restore();
  }

  function drawPoint(e) {
    var r = draw.cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function drawStart(e) {
    e.preventDefault();

    draw.strokes++;
    try { draw.cv.setPointerCapture(e.pointerId); } catch (err) {}
    var p = drawPoint(e);
    draw.ctx.strokeStyle = draw.color;
    draw.ctx.beginPath();
    draw.ctx.moveTo(p.x, p.y);
    draw.ctx.lineTo(p.x + 0.1, p.y); // 点を打っただけでも描けるように
    draw.ctx.stroke();
    draw.last = p;
  }
  function drawMove(e) {
    if (!draw || !draw.drawing) return;
    e.preventDefault();
    var p = drawPoint(e);
    draw.ctx.strokeStyle = draw.color;
    draw.ctx.beginPath();
    draw.ctx.moveTo(draw.last.x, draw.last.y);
    draw.ctx.lineTo(p.x, p.y);
    draw.ctx.stroke();
    draw.last = p;
  }
  function drawEnd() { if (draw) draw.drawing = false; }

  var MK_NOTES = [

  // うたのときは、次にたたく板を光らせ、上に曲の音のならびを出す
  function markSong() {
    var want = mk.song && !mk.playing ? mk.song.notes[mk.at] : -1;
    Array.prototype.forEach.call(document.querySelectorAll("#xylo .mk-key"), function (k, i) {

    }).join("") : "";

  function flashKey(k) {
    k.classList.remove("hit");

    floatNote(k, MK_NOTES[i].c);
    if (!mk.song || mk.playing || i !== mk.song.notes[mk.at]) return; // ほかの板も ふつうに鳴るだけ（まちがいにしない）

    var t = 1100;
    mk.song.notes.forEach(function (n, j) {
      later(function () { mallet(MK_NOTES[n].f); flashKey(keys[n]); }, t);

  (function () {

  // 点 i の数字を置く向き（となりの2つの辺から、絵の外がわへ はなれる向き）
  function tsOutward(pts, i) {
    var n = pts.length, s = 0;
    for (var k = 0; k < n; k++) s += pts[k][0] * pts[(k + 1) % n][1] - pts[(k + 1) % n][0] * pts[k][1];
    var sign = s > 0 ? 1 : -1;
    function nrm(p, q) {

    if (!m) return;
    var pt = ts.svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;

    var dotEls = ts.svg.querySelectorAll(".ts-dot");
    for (var i = ts.at + 1; i < pts.length; i++) {

      void dotEls[i].getBoundingClientRect();
      dotEls[i].classList.add("nope");

    }
