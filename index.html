    if (c.group) {
      // 4こは2+2、5こは3+2、6こは3+3 に並べて、いくつあるかを一目で見やすくする（端末の文字幅に左右されない）
      var rows = c.group === 6 ? [3, 3] : c.group === 5 ? [3, 2] : c.group === 4 ? [2, 2] : [c.group];
      var fs = c.group > 3 ? 48 : 60;
      return '<span class="group-box">' + rows.map(function (n) {
        var row = "";
        for (var i = 0; i < n; i++) row += '<span class="emo" style="font-size:calc(var(--k) * ' + fs + 'px)">' + c.emo + '</span>';
        return '<span class="group-row">' + row + '</span>';
      }).join("") + '</span>';
    }
    if (c.color) return '<span class="swatch" style="background-color:' + c.color + '"></span>';
    if (c.shape) return '<svg class="shape" viewBox="0 0 100 100" aria-hidden="true">' + c.shape + '</svg>';
    return '<span class="emo' + (c.sil ? " sil" : "") + '" style="font-size:calc(var(--k) * ' + (c.size || 110) + 'px)">' + c.emo + '</span>';
  }

  function drawDots(id, total, done) {
    var d = document.getElementById(id);
    d.innerHTML = "";
    for (var i = 0; i < total; i++) {
      var s = document.createElement("span");
      // いま増えた星だけ、ぽんと はずませる
      s.className = "dot" + (i < done ? " done" : "") + (i === done - 1 ? " just" : "");
      d.appendChild(s);
    }
  }

  function answer(el, key) {
    // 正解のあと次の問題に移るまでは受け付けない（連打で2回記録されて1問とばないように）
    if (cur.locked) return;
    var ok = key === cur.q.answer;
    if (!ok) {
      // 減点なし・バツなし。静かに選べなくなるだけ
      cur.tries++;
      el.classList.add("dim");
      // 2回目を選ぶときに足場を出す（正解の枠をそっと示す）。
      // 3択で2回外すまで待つと、その時点で正解しか残っていないため1回目で出す
      var right = document.querySelector('.choice[data-key="' + cur.q.answer + '"]');
      if (right) right.classList.add("hint");
      return;
    }
    cur.locked = true;
    el.classList.add("right");
    burst(el, 10);
    play("right");
    record(cur.key, cur.tries === 0);
    later(function () { cur.i++; nextQ(); }, 700);
  }

  function record(task, firstTry) {
    log.push({ t: Date.now(), task: task, first: firstTry ? 1 : 0 });
    if (log.length > 3000) log = log.slice(-3000);
    save(KEY_LOG, log);
  }

  // おしまい画面。やった数だけ星がならぶ（正解の数ではなく、やりきった数）。
  // 最後までやると、シールが1まいもらえる（noSticker：おえかきで何もかかずに「できた」を押したときなど）
  var MASCOTS = ["🐻", "🐰", "🐱", "🐶", "🐼", "🐯", "🦊", "🐥", "🐧", "🐸"];
  var lastMascot = null;
  // opt.chips：星のかわりに ならべる字（文字のなぞりで 書いた字）、opt.say：「おしまい」のかわりに 読むことば
  function finish(n, noSticker, opt) {
    opt = opt || {};
    var m;
    do { m = pick(MASCOTS); } while (m === lastMascot); // 毎回ちがう子が出てくる
    lastMascot = m;
    document.getElementById("finish-mascot").textContent = m;
    play("finish");
    var box = document.getElementById("finish-stars");
    box.innerHTML = "";
    var items = opt.chips || [], step = opt.chips ? .06 : .12, count = opt.chips ? items.length : n;
    box.classList.toggle("many", count > 5);
    for (var i = 0; i < count; i++) {
      var s = document.createElement("span");
      s.className = opt.chips ? "fchip" : "dot done";
      if (opt.chips) s.textContent = items[i];
      s.style.animationDelay = (0.15 + i * step).toFixed(2) + "s";
      box.appendChild(s);
    }
    var gift = noSticker ? null : giveSticker();
    document.getElementById("finish-sticker").innerHTML = gift
      ? '<span class="stk" style="--r:' + gift.r + 'deg;animation-delay:' + (0.3 + count * step).toFixed(2) + 's">' + gift.e + '</span>シール ゲット'
      : "";
    go("finish");
    say(opt.say || "おしまい");
  }

  // 正解・完成・割れたときの、小さな粒（音なし・0.7秒で消える）
  var SPARK = ["#ffc93c", "#ff8fa3", "#7cc6ff", "#8ee0a1", "#c9a7ff"];
  function burst(el, n, colors) {
    var r = el.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var dist = Math.max(r.width, r.height) / 2 + 24;
    colors = colors || SPARK;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      var a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
      var d = dist * (0.8 + Math.random() * 0.4);
      s.className = "spark" + (i % 3 === 0 ? " star" : "");
      s.style.left = cx + "px";
      s.style.top = cy + "px";
      s.style.background = colors[i % colors.length];
      s.style.setProperty("--dx", (Math.cos(a) * d).toFixed(1) + "px");
      s.style.setProperty("--dy", (Math.sin(a) * d).toFixed(1) + "px");
      document.body.appendChild(s);
      setTimeout(s.remove.bind(s), 800);
    }
  }

  /* ============ しゃぼんだま・ふうせん（自由あそび・記録なし） ============ */
  // 逃げない・消えない・時間制限なし。決まった数を割ったらおしまい
  var POPS = 8;
  var HUES = [200, 170, 130, 20, 330, 280]; // しゃぼんだま：背景に溶けやすい うすい黄色は使わない
  var BALLOON_COLORS = ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e44ad", "#f06292"];
  var BALLOON_SVG = '<svg viewBox="0 0 100 160" aria-hidden="true">' +
    '<path class="b-string" d="M50 110 C 43 124 57 136 48 156"/>' +
    '<path class="b-knot" d="M43 111 L57 111 L50 101 Z"/>' +
    '<path class="b-body" d="M50 4 C 22 4 7 27 7 52 C 7 80 29 100 50 105 C 71 100 93 80 93 52 C 93 27 78 4 50 4 Z"/>' +
    '<path class="b-shade" d="M50 105 C 71 100 93 80 93 52 C 93 38 88 26 80 18 C 84 30 84 44 80 58 C 73 82 60 96 50 105 Z"/>' +
    '<ellipse class="b-shine" cx="33" cy="32" rx="8" ry="15" transform="rotate(-25 33 32)"/></svg>';
  var game = null;

  function startPop(kind) {
    go("pop");
    // 色は袋から順に出す（同じ色ばかり続かないように）
    game = { kind: kind, popped: 0, spawned: 0, colors: shuffle(kind === "balloon" ? BALLOON_COLORS : HUES) };
    document.getElementById("pond").innerHTML = "";
    drawDots("pop-dots", POPS, 0);
    for (var i = 0; i < 3; i++) spawnPop();
  }

  function spawnPop() {
    if (!game || game.spawned >= POPS) return;
    var pond = document.getElementById("pond");
    var W = pond.clientWidth, H = pond.clientHeight;
    var balloon = game.kind === "balloon";
    var w = balloon ? Math.max(76, Math.min(150, Math.round(Math.min(W, H) * 0.24)))
                    : Math.max(90, Math.min(170, Math.round(Math.min(W, H) * 0.3)));
    var h = balloon ? Math.round(w * 1.6) : w;
    var spot = freeSpot(pond, w, h);
    var color = game.colors[game.spawned % game.colors.length];
    game.spawned++;
    var b = document.createElement("button");
    b.className = "popper " + game.kind;
    b.setAttribute("aria-label", balloon ? "ふうせん" : "しゃぼんだま");
    b.style.width = w + "px";
    b.style.height = h + "px";
    b.style.left = spot.x + "px";
    b.style.animationDelay = -(Math.random() * 3).toFixed(2) + "s";
    b._x = spot.x;
    b._y = spot.y;
    if (balloon) {
      b.style.setProperty("--c", color);
      b.innerHTML = BALLOON_SVG;
      b.style.top = (H + 10) + "px"; // 下の見えない所から、ふわっと上がってくる
    } else {
      b.style.setProperty("--h", color);
      b.style.top = spot.y + "px";
      b.classList.add("new");
    }
    // 指が触れた瞬間に割れるよう pointerdown。キーボード操作用に click も受ける
    b.addEventListener("pointerdown", function () { popIt(b); });
    b.addEventListener("click", function () { popIt(b); });
    pond.appendChild(b);
    void b.offsetWidth; // 一度配置を確定させてから動かす
    if (balloon) b.style.top = spot.y + "px"; else b.classList.remove("new");
  }

  // ほかと重ならない場所をさがす（見つからなければ一番すいている所）。位置は行き先（_x, _y）でくらべる
  function freeSpot(pond, w, h) {
    var W = pond.clientWidth, H = pond.clientHeight;
    var others = Array.prototype.filter.call(pond.children, function (o) { return !o.classList.contains("pop"); });
    var best = null, bestGap = -Infinity;
    for (var t = 0; t < 40; t++) {
      var x = 12 + Math.random() * Math.max(0, W - w - 24);
      var y = 16 + Math.random() * Math.max(0, H - h - 32);
      var gap = Infinity;
      others.forEach(function (o) {
        var ow = o.offsetWidth, oh = o.offsetHeight;
        var dx = (o._x + ow / 2) - (x + w / 2), dy = (o._y + oh / 2) - (y + h / 2);
        gap = Math.min(gap, Math.sqrt(dx * dx + dy * dy) - (Math.max(ow, oh) + Math.max(w, h)) / 2 * 0.8);
      });
      if (gap > bestGap) { bestGap = gap; best = { x: x, y: y }; }
      if (gap > 12) break;
    }
    return best;
  }

  function popIt(b) {
    if (!game || b.classList.contains("pop")) return;
    var balloon = game.kind === "balloon";
    b.classList.add("pop");
    if (balloon) {
      var c = b.style.getPropertyValue("--c");
      burst(b.querySelector(".b-body"), 10, [c, "#ffd766", c, "#ffffff"]);
    } else {
      burst(b, 8);
    }
    play(balloon ? "pop2" : "pop");
    game.popped++;
    drawDots("pop-dots", POPS, game.popped);
    later(function () { b.remove(); }, 320);
    if (game.popped >= POPS) later(function () { finish(POPS); }, 900);
    else later(spawnPop, 450);
  }

  // 画面の向きが変わっても、見える範囲に収まるように
  window.addEventListener("resize", function () {
    if (current !== "pop") return;
    var pond = document.getElementById("pond");
    Array.prototype.forEach.call(pond.children, function (b) {
      b._x = Math.max(0, Math.min(b._x, pond.clientWidth - b.offsetWidth - 12));
      b._y = Math.max(0, Math.min(b._y, pond.clientHeight - b.offsetHeight - 16));
      b.style.left = b._x + "px";
      b.style.top = b._y + "px";
    });
  });

  /* ============ パズル（かたちはめ・えあわせ） ============ */
  // ちがう場所に置くとピースが戻るだけ（×なし）。1回まちがえると、そのピースと正しい場所に枠が出る。
  // 指で動かすほか、「ピースをタップ → 置く場所をタップ」でも置ける。1回3つで、ピースは 2→3→4 と増える
  var SHAPE_COLORS = { "まる": "#e0533f", "さんかく": "#f3c21b", "しかく": "#3b7dd8", "ほし": "#3f9f5a", "ハート": "#ec6f9e" };
  // えあわせ：顔は左右がほぼ同じ形で取り違えやすいので、横長の帯（耳・目・口…）に分けて上から並べる
  var FACES = [
    { w: "いぬ", e: "🐶" }, { w: "ねこ", e: "🐱" }, { w: "パンダ", e: "🐼" }, { w: "かえる", e: "🐸" },
    { w: "くま", e: "🐻" }, { w: "ぶた", e: "🐷" }, { w: "うさぎ", e: "🐰" }, { w: "ライオン", e: "🦁" },
    { w: "とら", e: "🐯" }, { w: "さる", e: "🐵" }, { w: "コアラ", e: "🐨" }, { w: "うし", e: "🐮" }
  ];

  var PUZZLES = {
    hame: {
      ico: '<svg class="ico-svg" viewBox="0 0 100 100" aria-hidden="true">' +
           '<rect x="4" y="34" width="92" height="60" rx="12" fill="#e3c99c"/>' +
           '<circle cx="30" cy="64" r="17" fill="#e0533f"/><polygon points="70,49 87,79 53,79" fill="#b9955f"/>' +
           '<polygon points="70,4 88,36 52,36" fill="#f3c21b"/></svg>',
      label: "かたちはめ", sizes: [2, 3, 4], easySizes: [2, 2, 3], build: buildHame
    },
    eawase: { ico: "🧩", label: "えあわせ", sizes: [2, 3, 4], easySizes: [2, 2, 3], build: buildEawase }
  };

  var pz = null;       // いま遊んでいるパズル
  var drag = null;     // 指で動かしているピース
  var selected = null; // タップで選んだピース

  function startPuzzle(key) {
    go("puzzle");
    pz = { key: key, i: 0 };
    nextPuzzle();
  }

  function nextPuzzle() {
    var P = PUZZLES[pz.key];
    var sizes = (easy && P.easySizes) || P.sizes;
    if (pz.i >= sizes.length) { finish(sizes.length); return; }
    drag = null;
    selected = null;
    pz.mistakes = 0;
    pz.locked = false;
    drawDots("pz-dots", sizes.length, pz.i);
    var q = P.build(sizes[pz.i]);
    pz.left = sizes[pz.i];
    document.getElementById("pz-body").scrollTop = 0;
    document.getElementById("pz-prompt").textContent = q.prompt;
    say(q.prompt);
    var area = document.getElementById("pz-area");
    area.innerHTML = "";
    area.appendChild(q.board);
    area.appendChild(q.tray);
    Array.prototype.forEach.call(area.querySelectorAll(".pz-piece"), function (p) {
      p.addEventListener("pointerdown", pieceDown);
      p.addEventListener("pointermove", pieceMove);
      p.addEventListener("pointerup", pieceUp);
      p.addEventListener("pointercancel", pieceCancel);
    });
    Array.prototype.forEach.call(area.querySelectorAll(".pz-slot"), function (s) {
      s.addEventListener("click", function () { if (selected) tryPlace(selected, s); });
    });
  }

  function el(tag, cls) {
    var e = document.createElement(tag);
    e.className = cls;
    return e;
  }
  // 混ぜる。ただし正解と同じ並びにはしない（そのまま横にずらすだけ、にならないように）
  function mixed(items) {
    var sh = shuffle(items);
    if (items.length > 1 && sh.every(function (x, i) { return x === items[i]; })) sh.push(sh.shift());
    return sh;
  }
  function shapeSVG(s, cls, fill) {
    return '<svg class="' + cls + '" viewBox="0 0 100 100" aria-hidden="true"' +
           (fill ? ' style="fill:' + fill + '"' : "") + '>' + s.svg + '</svg>';
  }

  function buildHame(n) {
    var shapes = shuffle(SHAPES).slice(0, n);
    var board = el("div", "pz-board hame");
    var tray = el("div", "pz-tray");
    board.style.gridTemplateColumns = tray.style.gridTemplateColumns = "repeat(" + (n === 4 ? 2 : n) + ", auto)";
    shapes.forEach(function (s) {
      var slot = el("div", "pz-slot");
      slot.setAttribute("data-id", s.name);
      slot.innerHTML = shapeSVG(s, "hole");
      board.appendChild(slot);
    });
    mixed(shapes).forEach(function (s) {
      var cell = el("div", "pz-cell shape");
      var p = el("div", "pz-piece shape");
      p.setAttribute("data-id", s.name);
      p.innerHTML = shapeSVG(s, "", SHAPE_COLORS[s.name]);
      cell.appendChild(p);
      tray.appendChild(cell);
    });
    return { prompt: "かたち はめて", board: board, tray: tray };
  }

  var lastFace = null;
  function buildEawase(n) {
    var f;
    do { f = pick(FACES); } while (f === lastFace); // 同じどうぶつが続かないように
    lastFace = f;
    var rows = [];
    for (var r = 0; r < n; r++) rows.push(r);
    var board = el("div", "pz-board frame");
    var grid = el("div", "pz-grid");
    grid.style.gridTemplateRows = "repeat(" + n + ", 1fr)";
    grid.innerHTML = '<div class="pic ghost">' + f.e + '</div>'; // うすい見本
    rows.forEach(function (r) {
      var slot = el("div", "pz-slot");
      slot.setAttribute("data-id", r);
      grid.appendChild(slot);
    });
    board.appendChild(grid);
    var tray = el("div", "pz-tray strips");
    mixed(rows).forEach(function (r) {
      var cell = el("div", "pz-cell strip");
      var p = el("div", "pz-piece strip");
      p.setAttribute("data-id", r);
      p.style.setProperty("--r", r);
      p.innerHTML = '<div class="pic">' + f.e + '</div>';
      cell.appendChild(p);
      tray.appendChild(cell);
    });
    board.style.setProperty("--n", n);
    tray.style.setProperty("--n", n);
    return { prompt: f.w + " つくって", board: board, tray: tray };
  }

  function select(p) {
    if (selected) selected.classList.remove("sel");
    selected = p;
    if (p) p.classList.add("sel");
  }

  function pieceDown(e) {
    var p = e.currentTarget;
    if (!pz || pz.locked || drag || p.parentNode.classList.contains("pz-slot")) return;
    e.preventDefault();
    drag = { piece: p, id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false };
    try { p.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function pieceMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved) {
      if (Math.abs(dx) + Math.abs(dy) < 12) return; // 指の小さなぶれはタップとして扱う
      drag.moved = true;
      select(null);
      drag.piece.classList.add("lift");
    }
    drag.piece.style.transition = "none";
    drag.piece.style.translate = dx + "px " + dy + "px";
  }
  function pieceUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag;
    drag = null;
    if (!d.moved) { select(selected === d.piece ? null : d.piece); return; } // タップ＝ピースを選ぶ
    d.piece.classList.remove("lift");
    var slot = slotNear(d.piece);
    if (slot) tryPlace(d.piece, slot); else goHome(d.piece);
  }
  function pieceCancel(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.piece.classList.remove("lift");
    goHome(drag.piece);
    drag = null;
  }

  // 置いた位置にいちばん近い空きの場所（近くになければ null）。小さい子の手でも入るよう広めに判定する
  function slotNear(piece) {
    var r = piece.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var best = null, bestD = Infinity;
    Array.prototype.forEach.call(document.querySelectorAll("#pz-area .pz-slot:not(.filled)"), function (s) {
      var q = s.getBoundingClientRect();
      var d = Math.hypot(q.left + q.width / 2 - cx, q.top + q.height / 2 - cy);
      if (d < bestD && d < Math.max(q.width, q.height) * 0.6) { best = s; bestD = d; }
    });
    return best;
  }

  function tryPlace(piece, slot) {
    if (pz.locked || slot.classList.contains("filled")) return;
    select(null);
    if (slot.getAttribute("data-id") !== piece.getAttribute("data-id")) {
      // ちがう場所：ピースが戻るだけ。そのピースと正しい場所に、そっと枠を出す
      pz.mistakes++;
      play("soft");
      goHome(piece);
      piece.classList.add("hint");
      var right = document.querySelector('#pz-area .pz-slot[data-id="' + piece.getAttribute("data-id") + '"]');
      if (right) right.classList.add("hint");
      return;
    }
    piece.classList.remove("hint");
    slot.classList.remove("hint");
    slot.classList.add("filled");
    play("place");
    flipInto(piece, slot);
    piece.classList.add("snap");
    if (--pz.left === 0) finishPuzzle();
  }

  // いま見えている位置から、はまる場所まですべらせて移す
  function flipInto(piece, slot) {
    var a = piece.getBoundingClientRect();
    slot.appendChild(piece);
    piece.style.transition = "none";
    piece.style.translate = "0px 0px";
    var b = piece.getBoundingClientRect();
    piece.style.translate = (a.left - b.left) + "px " + (a.top - b.top) + "px";
    void piece.offsetWidth;
    piece.style.transition = "translate .25s ease";
    piece.style.translate = "0px 0px";
  }

  function goHome(piece) {
    piece.style.transition = "translate .3s ease, scale .15s ease";
    piece.style.translate = "0px 0px";
  }

  function finishPuzzle() {
    pz.locked = true;
    var board = document.querySelector("#pz-area .pz-board");
    board.classList.add("done");
    burst(board, 14);
    record(pz.key, pz.mistakes === 0);
    later(function () { pz.i++; nextPuzzle(); }, 1200);
  }

  /* ============ きおく・なぞり・おえかき ============ */
  var GAMES = {
    memory: {
      ico: '<svg class="ico-svg" viewBox="0 0 100 100" aria-hidden="true">' +
           '<rect x="8" y="22" width="40" height="56" rx="7" fill="#f0c65a" transform="rotate(-8 28 50)"/>' +
           '<rect x="52" y="22" width="40" height="56" rx="7" fill="#fff" stroke="#d9c9ae" stroke-width="3"/>' +
           '<circle cx="72" cy="50" r="11" fill="#e0533f"/></svg>',
      label: "きおく", age: 2, sizes: [2, 3, 4], easySizes: [2, 2, 3], start: startMemory
    },
    // ことばづくり：1回3つ。文字の数が 2→3→4 と増える
    kotobazukuri: {
      ico: '<span class="blk-ico"><b>ね</b><b>こ</b></span>',
      label: "ことばづくり", age: 4, sizes: [2, 3, 4], easySizes: [2, 2, 3], start: startWord
    }
  };

  /* --- きおく（同じ絵を2枚さがす） --- */
  var mem = null;

  function startMemory() {
    go("memory");
    mem = { i: 0 };
    nextMemory();
  }

  function nextMemory() {
    var sizes = (easy && GAMES.memory.easySizes) || GAMES.memory.sizes;
    if (mem.i >= sizes.length) { finish(sizes.length); return; }
    var pairs = sizes[mem.i];
    mem.open = [];
    mem.left = pairs;
    mem.mistakes = 0;
    mem.lock = false;
    drawDots("mem-dots", sizes.length, mem.i);
    say("おなじ さがして");
    var area = document.getElementById("mem-area");
    area.innerHTML = "";
    area.style.gridTemplateColumns = "repeat(" + (pairs >= 4 ? 4 : pairs === 3 ? 3 : 2) + ", auto)";
    var kinds = shuffle(POOL).slice(0, pairs);
    shuffle(kinds.concat(kinds)).forEach(function (e) {
      var c = el("button", "mem-card");
      c.setAttribute("data-id", e);
      c.innerHTML = '<span class="mem-inner"><span class="mem-face back">⭐</span>' +
                    '<span class="mem-face front">' + e + '</span></span>';
      c.addEventListener("click", function () { flipCard(c); });
      area.appendChild(c);
    });
  }

  function flipCard(c) {
    if (!mem || mem.lock || c.classList.contains("open") || c.classList.contains("done")) return;
    c.classList.add("open");
    play("tap");
    mem.open.push(c);
    if (mem.open.length < 2) return;
    var a = mem.open[0], b = mem.open[1];
    mem.open = [];
    if (a.getAttribute("data-id") === b.getAttribute("data-id")) {
      mem.left--;
      play("right");
      later(function () {
        a.classList.add("done");
        b.classList.add("done");
        burst(a, 6);
        burst(b, 6);
        if (mem.left === 0) {
          mem.lock = true;
          record("memory", mem.mistakes === 0);
          later(function () { mem.i++; nextMemory(); }, 1100);
        }
      }, 280);
    } else {
      // そろわなかったら、そっと裏に戻るだけ（音もバツも出さない）
      mem.mistakes++;
      mem.lock = true;
      later(function () {
        a.classList.remove("open");
        b.classList.remove("open");
        mem.lock = false;
      }, 950);
    }
  }

    tr.at = 0;

    var nd = Math.max(3, Math.round(len / 5.5)), html = "";
    tr.dotAt = [];
    for (i = 1; i < nd; i++) {
      var at = len * i / nd;
      if (at < 6.5 || len - at < 5.5) continue; // 番号の丸・星と かさならないように
      var p = track.getPointAtLength(at);
      html += '<circle class="tr-dot" cx="' + p.x.toFixed(2) + '" cy="' + p.y.toFixed(2) + '" r="1.6"/>';
      tr.dotAt.push(i / nd);
    }
    tr.dotsEl.innerHTML = html;
    tr.dots = tr.dotsEl.querySelectorAll(".tr-dot");
    tr.goal.setAttribute("transform", "translate(" + pts[n].x.toFixed(2) + " " + pts[n].y.toFixed(2) + ")");
    tr.start.setAttribute("transform", "translate(" + pts[0].x.toFixed(2) + " " + pts[0].y.toFixed(2) + ")");
    // ぐるっと まわって もどる線（6・8・0 など）は、おわりの星が はじめのほうで通る所の近くにある。
    // 星を目ざして近道しないよう、その所を通りすぎるまで 星は出さない
    tr.starWait = 0;
    for (var s2 = 0; s2 < len - 15; s2++) {
      var q = track.getPointAtLength(s2);
      if (Math.hypot(q.x - pts[n].x, q.y - pts[n].y) < 10) tr.starWait = s2;
    }
    // 文字は 書く順の番号を入れる（線の形のなぞりは 番号なし）
    tr.start.querySelector("text").textContent = tr.items[tr.i].ch ? tr.s + 1 : "";
    markDots();
  }

  // なぞったところの点を消し、つぎの点を光らせる。書きはじめる前は 番号の丸を光らせる
  function markDots() {
    var f = tr.at / tr.n, next = -1;
    for (var i = 0; i < tr.dots.length; i++) {
      var past = tr.dotAt[i] <= f + 1e-6;
      if (!past && next < 0) next = i;
      tr.dots[i].classList.toggle("past", past);
      tr.dots[i].classList.toggle("next", i === next && tr.at > 0);
    }
    tr.start.classList.toggle("go", tr.at === 0);
    tr.goal.classList.toggle("wait", tr.len * f <= tr.starWait && tr.starWait > 0);
  }

  // いまの画を、はじめから p（長さ）まで 緑にする。文字は 真ん中の線（はじめ・おわりの重なる所は のぞく）と、
  // まだの所を もどす線も いっしょに のばす
  function paintTo(p) {
    tr.doneEl.style.strokeDashoffset = tr.len - p;
    var c = tr.coreEl;
    if (c) {
      var vis = Math.max(0, Math.min(p, c._L - c._s1) - c._s0);
      c.style.strokeDasharray = "0 " + c._s0.toFixed(2) + " " + vis.toFixed(2) + " " + (c._L + 50).toFixed(0);
    }
    if (tr.coverEl) tr.coverEl.style.strokeDashoffset = -p;
  }

  // ゆびが次の点に近づいたら、そこまで線がのびる（少しずれても進むので、小さい子でもできる）
  function traceMove(e) {
    if (!tr || tr.locked) return;
    if (e.type === "pointermove" && e.pointerType === "mouse" && !e.buttons) return;
    e.preventDefault();
    var m = (tr.track || tr.svg).getScreenCTM();
    if (!m) return;
    var pt = tr.svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    var p = pt.matrixTransform(m.inverse()); // 線と同じ座標系に直す
    var next = tr.pts[tr.at + 1];
    if (!next) return;
    var dx = p.x - next.x, dy = p.y - next.y;
    if (Math.sqrt(dx * dx + dy * dy) > 11) return;
    tr.at++;
    paintTo(tr.len * tr.at / tr.n);
    note(tr.at - 1); // 進むほど音が高くなる
    markDots();
    if (tr.at < tr.n) return;
    if (tr.s + 1 < tr.items[tr.i].strokes.length) {
      // 次の画へ（ひらがな）
      tr.s++;
      play("place");
      setupStroke();
      return;
    }
    tr.locked = true;
    // 文字：最後まで なぞれたら、字をまるごと緑にする（ぬり残しが小さく出ないように）
    tr.svg.classList.add("whole");
    burst(tr.goal, 12);
    play("right");
    // 文字は 書けたら すぐ記録する（つぎの字へ うつる前に もどっても、はなまるが つく）
    if (tr.letters) letterDone();

      if (!tr.letters) { tr.i++; nextTrace(); return; }
      if (tr.idx >= LETTERS[tr.kind].length) lettersFinish(true); // さいごの字まで 書けた
      else nextTrace();
    }, 1100);
  }

  var DRAW_COLORS = ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e44ad", "#8d5a2b", "#333333"];

    var old = keep && cv.width ? cv.toDataURL() : null;
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    cv.style.width = r.width + "px";
    cv.style.height = r.height + "px";
    var ctx = draw.ctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 14;
    if (old) {
      var img = new Image();
      img.onload = function () { ctx.drawImage(img, 0, 0, r.width, r.height); };
      img.src = old;
    }
  }

    draw.last = p;
  }
  function drawMove(e) {
    if (!draw || !draw.drawing) return;
    e.preventDefault();
    var p = drawPoint(e);
    draw.ctx.strokeStyle = draw.color;
    draw.ctx.beginPath();
    draw.ctx.moveTo(draw.last.x, draw.last.y);
    draw.ctx.lineTo(p.x, p.y);
    draw.ctx.stroke();
    draw.last = p;
  }

  // うたのときは、次にたたく板を光らせ、上に曲の音のならびを出す
  function markSong() {

    Array.prototype.forEach.call(document.querySelectorAll("#xylo .mk-key"), function (k, i) {

        var st = k.querySelector(".mk-star");

      return '<span class="' + (j < mk.at ? "done" : j === mk.at && !mk.playing ? "now" : "") + '" style="--c:' + MK_NOTES[n].c + '"></span>';

  /* ============ てんつなぎ（記録なし） ============ */
  // 1から じゅんばんに点をつなぐと、絵が出てくる。点はタッチしても、指をすべらせても つながる。
  // ちがう点を押しても何も起きない（その点が小さくゆれて、次の点がそっと光る）。1回3まいで、点が増えていく
  var TS_PICS = [
    { name: "おうち", lv: 0, fill: "#ffcc80", pts: [[22, 86], [22, 46], [50, 16], [78, 46], [78, 86]],
      art: '<rect x="42" y="64" width="16" height="22" rx="2" fill="#a1887f"/>' +
           '<rect x="28" y="54" width="11" height="11" rx="2" fill="#bbdefb"/><rect x="61" y="54" width="11" height="11" rx="2" fill="#bbdefb"/>' },
    { name: "テント", lv: 0, fill: "#81c784", pts: [[50, 14], [86, 82], [60, 82], [50, 62], [40, 82], [14, 82]],
      art: '<polygon points="50,62 60,82 40,82" fill="#5d4037" opacity=".55"/><circle cx="50" cy="11" r="3" fill="#e53935"/>' },
    { name: "ヨット", lv: 1, fill: "#90caf9", pts: [[50, 12], [78, 58], [88, 64], [76, 82], [24, 82], [12, 64], [50, 64]],
      art: '<polygon points="50,14 76,58 50,58" fill="#fff"/><polygon points="12,64 88,64 76,82 24,82" fill="#a1887f"/>' +

  var ts = null;

  function startTentsu() {
    go("tentsu");
    var lv = easy ? [0, 0, 1] : [0, 1, 2];
    var used = [];
    ts = { i: 0, pics: lv.map(function (l) {
      var p = pick(TS_PICS.filter(function (x) { return x.lv === l && used.indexOf(x) === -1; }));
      used.push(p);
      return p;
    }) };
    nextTentsu();
  }

  // 点 i の数字を置く向き（となりの2つの辺から、絵の外がわへ はなれる向き）
  function tsOutward(pts, i) {
    var n = pts.length, s = 0;
    for (var k = 0; k < n; k++) s += pts[k][0] * pts[(k + 1) % n][1] - pts[(k + 1) % n][0] * pts[k][1];
    var sign = s > 0 ? 1 : -1;
    function nrm(p, q) {
      var dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1;
      return [sign * dy / L, -sign * dx / L];
    }
    var a = nrm(pts[(i - 1 + n) % n], pts[i]), b = nrm(pts[i], pts[(i + 1) % n]);
    var v = [a[0] + b[0], a[1] + b[1]], L = Math.hypot(v[0], v[1]) || 1;
    return [v[0] / L, v[1] / L];
  }

  function nextTentsu() {
    if (ts.i >= ts.pics.length) { finish(ts.pics.length); return; }
    drawDots("ts-dots", ts.pics.length, ts.i);
    var p = ts.pics[ts.i], pts = p.pts;
    ts.at = 0;
    ts.lock = false;
    var dots = pts.map(function (q, i) {
      return '<circle class="ts-dot' + (i === 0 ? " start" : "") + '" cx="' + q[0] + '" cy="' + q[1] + '" r="3"/>';
    }).join("");
    var nums = pts.map(function (q, i) {
      var o = tsOutward(pts, i);
      var x = Math.max(5, Math.min(95, q[0] + o[0] * 7)), y = Math.max(5, Math.min(96, q[1] + o[1] * 7));
      return '<text class="ts-num" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '">' + (i + 1) + '</text>';
    }).join("");
    var area = document.getElementById("ts-area");
    area.innerHTML = '<svg class="ts-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">' +
      '<g class="ts-art"><polygon points="' + pts.join(" ") + '" fill="' + p.fill + '"/>' + p.art + '</g>' +
      '<g class="ts-lines"></g>' + dots + nums + '</svg>';
    ts.svg = area.querySelector("svg");
    ts.svg.addEventListener("pointerdown", tsMove);
    ts.svg.addEventListener("pointermove", tsMove);
    document.getElementById("ts-body").scrollTop = 0;
    say("1から つないで");
  }

  function tsMove(e) {
    if (!ts || ts.lock) return;
    if (e.type === "pointermove" && e.pointerType === "mouse" && !e.buttons) return;
    e.preventDefault();
    var m = ts.svg.getScreenCTM();
    if (!m) return;
    var pt = ts.svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    var p = pt.matrixTransform(m.inverse());
    var pts = ts.pics[ts.i].pts, next = pts[ts.at];
    if (Math.hypot(p.x - next[0], p.y - next[1]) < 9) { tsConnect(); return; }
    if (e.type !== "pointerdown") return;
    // ちがう点をタッチしたとき：その点が小さくゆれて、つぎの点がそっと光る（×は出さない）
    var dotEls = ts.svg.querySelectorAll(".ts-dot");
    for (var i = ts.at + 1; i < pts.length; i++) {
      if (Math.hypot(p.x - pts[i][0], p.y - pts[i][1]) > 7) continue;
      dotEls[i].classList.remove("nope");
      void dotEls[i].getBoundingClientRect();
      dotEls[i].classList.add("nope");
      dotEls[ts.at].classList.add("hint");
      return;
    }
  }

  function tsConnect() {
    var pic = ts.pics[ts.i], pts = pic.pts, i = ts.at;
    var dot = ts.svg.querySelectorAll(".ts-dot")[i];
    dot.classList.remove("start", "hint", "nope");
    dot.classList.add("on");
    ts.svg.querySelectorAll(".ts-num")[i].classList.add("on");
    if (i > 0) tsLine(pts[i - 1], pts[i]);
    note(i);
    say(String(i + 1)); // 数字を声で読む
    ts.at++;
    if (ts.at < pts.length) return;
    // さいごの点から 1 に もどって、絵ができあがる
    ts.lock = true;
    later(function () { tsLine(pts[pts.length - 1], pts[0]); }, 250);
    later(function () {
      ts.svg.querySelector(".ts-art").classList.add("on");
      burst(ts.svg, 16);
      play("right");
      say(pic.name);
    }, 650);
    later(function () { ts.i++; nextTentsu(); }, 2300);
  }

  function tsLine(a, b) {
    var ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    var L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    ln.setAttribute("class", "ts-line");
    ln.setAttribute("x1", a[0]);
    ln.setAttribute("y1", a[1]);
    ln.setAttribute("x2", b[0]);
    ln.setAttribute("y2", b[1]);
    ln.style.strokeDasharray = L + " " + (L + 10);
    ln.style.strokeDashoffset = L;
    ts.svg.querySelector(".ts-lines").appendChild(ln);
    ln.getBoundingClientRect(); // いったん描いてから、線がのびるようにする
    ln.style.strokeDashoffset = 0;
  }

  /* ============ めいろ（記録なし） ============ */
  // ゆびで どうぶつを うごかして、ゴールの食べものまで つれていく。1回3つで、だんだん広くなる。
  // 壁のむこうへは行けないだけ（時間制限なし）。いま いる所までの道すじに線が残る
  var MAZE_PAIRS = [
    ["🐭", "🧀", "チーズ"], ["🐰", "🥕", "にんじん"], ["🐶", "🦴", "ほね"], ["🐵", "🍌", "バナナ"],
    ["🐻", "🍯", "はちみつ"], ["🐱", "🐟", "さかな"], ["🐿️", "🌰", "どんぐり"]
  ];
  var MZ = 10; // 1マスの大きさ（SVG の目盛り）
  var mz = null;

  function startMaze() {
    go("maze");
    mz = { i: 0, sizes: easy ? [[3, 2], [3, 3], [4, 3]] : [[4, 3], [5, 4], [6, 5]], pairs: shuffle(MAZE_PAIRS) };
    nextMaze();
  }

  // 1本道でつながった めいろを作る（どのマスからも、ゴールへの道はひとつだけ）。walls[マス] = [上, 右, 下, 左] の壁
  function makeMaze(W, H) {
    var walls = [], seen = [], stack = [0];
    for (var c = 0; c < W * H; c++) { walls.push([true, true, true, true]); seen.push(false); }
    seen[0] = true;
    while (stack.length) {
      var cur = stack[stack.length - 1], x = cur % W, y = Math.floor(cur / W), nb = [];
      if (y > 0 && !seen[cur - W]) nb.push([cur - W, 0, 2]);
      if (x < W - 1 && !seen[cur + 1]) nb.push([cur + 1, 1, 3]);
      if (y < H - 1 && !seen[cur + W]) nb.push([cur + W, 2, 0]);
      if (x > 0 && !seen[cur - 1]) nb.push([cur - 1, 3, 1]);
      if (!nb.length) { stack.pop(); continue; }
      var n = pick(nb);
      walls[cur][n[1]] = false;
      walls[n[0]][n[2]] = false;
      seen[n[0]] = true;
      stack.push(n[0]);
    }
    return walls;
  }

  function nextMaze() {
    if (mz.i >= mz.sizes.length) { finish(mz.sizes.length); return; }
    drawDots("mz-dots", mz.sizes.length, mz.i);
    var area = document.getElementById("mz-area");
    var W = mz.sizes[mz.i][0], H = mz.sizes[mz.i][1];
    var r = area.getBoundingClientRect();
    if (r.height > r.width * 1.05) { var t = W; W = H; H = t; } // たて長の画面では、めいろも たて長に
    var pair = mz.pairs[mz.i % mz.pairs.length];
    mz.W = W;
    mz.H = H;
    mz.walls = makeMaze(W, H);
    mz.pos = 0;           // 指で進めた先（いちばん新しい場所）
    mz.goal = W * H - 1;
    mz.path = [0];        // いま いる所までの道すじ
    mz.queue = [];        // これから1マスずつ動く道
    mz.moving = false;
    mz.done = false;
    var pr = document.getElementById("mz-prompt");
    pr.textContent = pair[2] + "まで いこう";
    say(pr.textContent);
    var d = "";
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var w = mz.walls[y * W + x];
      if (w[0]) d += "M" + x * MZ + " " + y * MZ + "h" + MZ;
      if (w[3]) d += "M" + x * MZ + " " + y * MZ + "v" + MZ;
      if (y === H - 1 && w[2]) d += "M" + x * MZ + " " + (y + 1) * MZ + "h" + MZ;
      if (x === W - 1 && w[1]) d += "M" + (x + 1) * MZ + " " + y * MZ + "v" + MZ;
    }
    var P = 3;
    area.innerHTML = '<svg class="mz-svg" viewBox="' + (-P) + " " + (-P) + " " + (W * MZ + 2 * P) + " " + (H * MZ + 2 * P) +
      '" preserveAspectRatio="xMidYMid meet">' +
      '<rect class="mz-floor" x="0" y="0" width="' + W * MZ + '" height="' + H * MZ + '"/>' +
      '<rect class="mz-goalcell" x="' + (W - 1) * MZ + '" y="' + (H - 1) * MZ + '" width="' + MZ + '" height="' + MZ + '"/>' +
      '<polyline class="mz-trail" points="' + MZ / 2 + "," + MZ / 2 + '"/>' +
      '<path class="mz-wall" d="' + d + '"/>' +
      '<text class="mz-emo mz-goal" x="' + (W - .5) * MZ + '" y="' + (H - .5) * MZ + '">' + pair[1] + '</text>' +
      '<g class="mz-hero" style="transform:translate(' + MZ / 2 + 'px,' + MZ / 2 + 'px)"><text class="mz-emo" x="0" y="0">' + pair[0] + '</text></g>' +
      '</svg>';
    mz.svg = area.querySelector("svg");
    mz.svg.addEventListener("pointerdown", mzPointer);
    mz.svg.addEventListener("pointermove", mzPointer);
    document.getElementById("mz-body").scrollTop = 0;
  }

  function mzOpen(c) {
    var w = mz.walls[c], out = [];
    if (!w[0]) out.push(c - mz.W);
    if (!w[1]) out.push(c + 1);
    if (!w[2]) out.push(c + mz.W);
    if (!w[3]) out.push(c - 1);
    return out;
  }
  // 壁を通らずに、maxLen マス以内で行ける道（行けなければ null）
  function mzRoute(from, to, maxLen) {
    var prev = {}, dist = {}, q = [from];
    prev[from] = -1;
    dist[from] = 0;
    while (q.length) {
      var c = q.shift();
      if (c === to) break;
      if (dist[c] >= maxLen) continue;
      mzOpen(c).forEach(function (n) {
        if (!(n in prev)) { prev[n] = c; dist[n] = dist[c] + 1; q.push(n); }
      });
    }
    if (!(to in prev)) return null;
    var r = [];
    for (var k = to; k !== from; k = prev[k]) r.unshift(k);
    return r;
  }

  // 指のあるマスへ、壁を通らずに近い道で行ければ進む（どうぶつを すべらせても、行きたいマスをタッチしてもよい）
  function mzPointer(e) {
    if (!mz || mz.done) return;
    if (e.type === "pointermove" && e.pointerType === "mouse" && !e.buttons) return;
    e.preventDefault();
    var m = mz.svg.getScreenCTM();
    if (!m) return;
    var pt = mz.svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    var p = pt.matrixTransform(m.inverse());
    var cx = Math.floor(p.x / MZ), cy = Math.floor(p.y / MZ);
    if (cx < 0 || cy < 0 || cx >= mz.W || cy >= mz.H) return;
    var route = mzRoute(mz.pos, cy * mz.W + cx, 4);
    if (!route || !route.length) return;
    mz.queue = mz.queue.concat(route);
    mz.pos = route[route.length - 1];
    if (mz.pos === mz.goal) mz.done = true;
    if (!mz.moving) mzStep();
  }

  function mzStep() {
    if (!mz.queue.length) {
      mz.moving = false;
      if (mz.done) mazeGoal();
      return;
    }
    mz.moving = true;
    var c = mz.queue.shift();
    // 来た道をもどったら、線ももどす
    if (mz.path.length > 1 && mz.path[mz.path.length - 2] === c) mz.path.pop(); else mz.path.push(c);
    var ctr = function (k) { return [(k % mz.W + .5) * MZ, (Math.floor(k / mz.W) + .5) * MZ]; };
    var xy = ctr(c);
    mz.svg.querySelector(".mz-hero").style.transform = "translate(" + xy[0] + "px," + xy[1] + "px)";
    mz.svg.querySelector(".mz-trail").setAttribute("points", mz.path.map(function (k) { return ctr(k).join(","); }).join(" "));
    play("step");
    later(mzStep, 95);
  }

  function mazeGoal() {
    mz.svg.querySelector(".mz-hero").classList.add("yay");
    burst(mz.svg.querySelector(".mz-goal"), 14);
    play("right");
    say("ゴール");
    later(function () { mz.i++; nextMaze(); }, 1800);
  }

  /* ============ ことばづくり ============ */
  // 絵を見て、文字カードを ことばの順にタッチする。わくには うすいお手本の字がある。
  // ちがうカードは小さくゆれるだけ（×なし）。1回まちがえると、正しいカードに枠が出る。
  // 字は、あいうえお なぞり と同じ46字だけ（「が」や小さい「っ」のある ことばは使わない）
  var KZ_WORDS = {
    2: [["いぬ", "🐕"], ["ねこ", "🐈"], ["くま", "🐻"], ["さる", "🐒"], ["うし", "🐄"], ["うま", "🐴"], ["かめ", "🐢"],
        ["たこ", "🐙"], ["かに", "🦀"], ["いか", "🦑"], ["あり", "🐜"], ["りす", "🐿️"], ["とり", "🐦"], ["しか", "🦌"],
        ["はな", "🌷"], ["ほし", "⭐"], ["つき", "🌙"], ["くも", "☁️"], ["もも", "🍑"], ["なし", "🍐"], ["なす", "🍆"],
        ["いえ", "🏠"], ["ふね", "🚢"], ["くつ", "👟"], ["かさ", "☂️"], ["すし", "🍣"]],
    3: [["さかな", "🐟"], ["くるま", "🚗"], ["みかん", "🍊"], ["すいか", "🍉"], ["めがね", "👓"], ["きつね", "🦊"],
        ["とけい", "⏰"], ["たいこ", "🥁"], ["さくら", "🌸"], ["きのこ", "🍄"], ["あひる", "🦆"], ["ひよこ", "🐤"],
        ["いるか", "🐬"], ["かえる", "🐸"], ["はさみ", "✂️"], ["えほん", "📖"]],
    4: [["ひこうき", "✈️"], ["にわとり", "🐓"], ["ふうせん", "🎈"], ["たいよう", "☀️"], ["ひまわり", "🌻"], ["くつした", "🧦"]]
  };
  var KANA46 = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
  var kz = null, lastKz = null;

  function startWord() {
    go("word");
    var G = GAMES.kotobazukuri;
    kz = { i: 0, sizes: (easy && G.easySizes) || G.sizes, used: [] };
    nextWord();
  }

  function nextWord() {
    if (kz.i >= kz.sizes.length) { finish(kz.sizes.length); return; }
    drawDots("kz-dots", kz.sizes.length, kz.i);
    var list = KZ_WORDS[kz.sizes[kz.i]].filter(function (w) { return kz.used.indexOf(w[0]) === -1 && w[0] !== lastKz; });
    var w = pick(list);
    kz.used.push(w[0]);
    lastKz = w[0];
    kz.word = w[0];
    kz.at = 0;
    kz.mistakes = 0;
    kz.lock = false;
    var letters = w[0].split("");
    var tiles = letters.slice();
    // 4さい〜 のときは、ことばに無い字のカードを1まい まぜる
    if (!easy) tiles.push(pick(KANA46.split("").filter(function (c) { return letters.indexOf(c) === -1; })));
    var pic = document.getElementById("kz-pic");
    pic.textContent = w[1];
    pic.classList.remove("yay");
    document.getElementById("kz-slots").innerHTML = letters.map(function (c) {
      return '<div class="kz-slot"><span class="ghost-ch">' + c + '</span></div>';
    }).join("");
    var box = document.getElementById("kz-tiles");
    box.innerHTML = "";
    mixed(tiles).forEach(function (c) {
      var b = el("button", "kz-tile");
      b.textContent = c;
      b.setAttribute("data-ch", c);
      b.addEventListener("click", function () { kzTap(b); });
      box.appendChild(b);
    });
    document.getElementById("kz-body").scrollTop = 0;
    say(w[0]);
  }

  function kzTap(b) {
    if (!kz || kz.lock || b.classList.contains("placed")) return;
    var want = kz.word.charAt(kz.at);
    if (b.getAttribute("data-ch") !== want) {
      kz.mistakes++;
      play("soft");
      b.classList.remove("shake");
      void b.offsetWidth;
      b.classList.add("shake");
      var right = document.querySelector('#kz-tiles .kz-tile[data-ch="' + want + '"]');
      if (right) right.classList.add("hint");
      return;
    }
    Array.prototype.forEach.call(document.querySelectorAll("#kz-tiles .hint"), function (x) { x.classList.remove("hint"); });
    b.classList.remove("shake");
    b.classList.add("placed");
    // 抜けた所に同じ大きさの すきまを残して、ほかのカードが動かないようにする
    var gap = el("span", "kz-tile");
    gap.style.visibility = "hidden";
    b.parentNode.insertBefore(gap, b);
    flipInto(b, document.querySelectorAll("#kz-slots .kz-slot")[kz.at]);
    b.classList.add("snap");
    play("place");
    say(want);
    kz.at++;
    if (kz.at < kz.word.length) return;
    kz.lock = true;
    record("kotobazukuri", kz.mistakes === 0);
    later(function () {
      var pic = document.getElementById("kz-pic");
      pic.classList.add("yay");
      burst(pic, 14);
      play("right");
      say(kz.word);
    }, 450);
    later(function () { kz.i++; nextWord(); }, 2200);
  }

  /* ============ こえの ものさし（マイク・記録なし） ============ */
  // 声の大きさを「ちいさい こえ（ありさん）／ふつうの こえ（ねこさん）／おおきい こえ（ぞうさん）」の3つで見せる。
  // じゆう：声を出すと はりと絵がうごく。いってみよう：言われた大きさで言う。どんなとき：場面に合う声をえらんで、言う。
  // 合わなくても×はなく、しばらくすると「もうすこし ちいさく」などのヒントと「つぎへ」が出る
  var KOE_HOLD = 700; // ねらった大きさの声が あわせて 0.7秒 出たら できた
  var KOE_WORDS = ["おはよう", "こんにちは", "ありがとう", "いただきます", "おやすみ", "ばいばい", "もしもし", "やっほー"];
  var KOE_WORDS_EASY = ["あー", "ばいばい", "もしもし", "やっほー", "おはよう"];
  // どんなとき：場面と、合う声の大きさ（lv）と、そのとき言うことば
  var KOE_SCENES = [
    { lv: 0, e: "👶", sub: "💤", t: "あかちゃんが ねてる", w: "おやすみ" },
    { lv: 0, e: "🤫", t: "ないしょの おはなし", w: "あのね" },
    { lv: 0, e: "🚃", t: "でんしゃの なか", w: "つぎ おりるよ" },
    { lv: 0, e: "📚", t: "としょかん", w: "これ よもう" },
    { lv: 1, e: "🧒👧", t: "となりの おともだちと", w: "あそぼう" },
    { lv: 1, e: "🍙", t: "ごはんの とき", w: "おいしいね" },
    { lv: 1, e: "🏪", t: "おみせで", w: "これ ください" },
    { lv: 1, e: "☎️", t: "でんわで", w: "もしもし" },
    { lv: 2, e: "🏞️", sub: "🙋", t: "とおくの おともだちを よぶ", w: "おーい" },
    { lv: 2, e: "📣", t: "うんどうかいの おうえん", w: "がんばれー" },
    { lv: 2, e: "⛰️", t: "やまの うえで", w: "やっほー" }
  ];
  var KOE_MODES = [{ k: "free", t: "🎤 じゆう" }, { k: "say", t: "💬 いってみよう" }, { k: "scene", t: "🏠 どんなとき" }];
  var koe = null;

  function startKoe() {
    go("koe");
    koe = { mode: null, mic: "wait", stall: false, m: { j: -120, d: -120 }, sb: { b: -1 }, i: 0, q: null, step: null, last: [], waveAt: 0, band: -2 };
    var pills = document.getElementById("koe-pills");
    pills.innerHTML = "";
    KOE_MODES.forEach(function (md) {
      var b = el("button", "pill");
      b.textContent = md.t;
      b.setAttribute("data-mode", md.k);
      b.addEventListener("click", function () { play("tap"); koeMode(md.k); });
      pills.appendChild(b);
    });
    var r = koe.r = document.getElementById("koe-ruler");
    r.innerHTML = rulerHTML();
    r._p = 0;
    r._b = null;
    r.style.setProperty("--p", 0);
    koeMode("free");
    koeListen();
  }

  function koeListen() {
    koe.mic = "wait";
    koe.stall = false;
    koeMsg();
    micStart(koeFrame, function (why) {
      if (!koe || current !== "koe") return;
      koe.mic = why;
      koeMsg();
      if (koe.step !== "pick" && koe.step !== "picked") koeShow(); // 絵のところにも「つかえないよ」を出す
    }, function () {
      if (!koe) return;
      koe.mic = "ok";
      koeMsg();
    });
  }

  function koeMode(mode) {
    timers.forEach(clearTimeout);
    timers = [];
    koe.mode = mode;
    koe.i = 0;
    koe.q = null;
    koe.step = null;
    koe.last = [];
    Array.prototype.forEach.call(document.querySelectorAll("#koe-pills .pill"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-mode") === mode);
    });
    if (mode === "free") {
      document.getElementById("koe-dots").innerHTML = "";
      koePrompt("こえを だしてみて");
      koeShow();
      koeMsg();
      return;
    }
    drawDots("koe-dots", ROUND, 0);
    if (mode === "scene") koe.bag = koeScenes();
    koeNext();
  }

  // どんなとき の5つの場面。2〜3さい向けのときは、ちいさい と おおきい だけ。同じ大きさは3回続けない
  function koeScenes() {
    var pool = KOE_SCENES.filter(function (s) { return !easy || s.lv !== 1; }), bag, n = 0;
    do {
      bag = shuffle(pool).slice(0, ROUND);
    } while (n++ < 50 && bag.some(function (s, i) { return i >= 2 && s.lv === bag[i - 1].lv && s.lv === bag[i - 2].lv; }));
    return bag;
  }

  function koeNext() {
    if (koe.i >= ROUND) { finish(ROUND); return; }
    if (koe.mode === "scene") { koeSceneQ(koe.bag[koe.i]); return; }
    // いってみよう：同じ大きさは2回続けない（2〜3さい向けで ちいさい・おおきい だけのときは、3回続けない）
    var lvs = easy ? [0, 2] : [0, 1, 2], lv, w, n = 0;
    do { lv = pick(lvs); } while (n++ < 30 && repeated(koe.last, lv, easy ? 2 : 1));
    koe.last = koe.last.concat(lv).slice(-2);
    var words = easy ? KOE_WORDS_EASY : KOE_WORDS, prev = koe.q && koe.q.word;
    n = 0;
    do { w = pick(words); } while (n++ < 30 && w === prev);
    koeSayQ(lv, w);
  }

  function koePrompt(text, sayText) {
    var pr = document.getElementById("koe-prompt");
    pr.textContent = text;
    pr.setAttribute("data-say", sayText || text);
    pr.classList.remove("pop");
    void pr.offsetWidth;
    pr.classList.add("pop");
    say(sayText || text);
  }

  // 言われた大きさで言う（いってみよう／どんなとき の2つめ）
  function koeSayQ(lv, w, scene) {
    koe.step = "say";
    koe.q = { lv: lv, word: w, scene: scene || null, hold: 0, off: 0, dir: 0, hinted: false, done: false, on: false, onT: 0, shown: 0 };
    koePrompt(KOE_LV[lv].name + "で「" + w + "」", KOE_LV[lv].name + "で、" + w);
    koeShow();
    koeMsg();
  }

  // 場面を見て、ものさしの3つの所から 合う声をえらぶ
  function koeSceneQ(sc) {
    koe.step = "pick";
    koe.scene = sc;
    koe.q = null;
    koePrompt("こえを えらんで", sc.t + "。こえを えらんで");
    koeShow();
    koeMsg();
  }

  function scenePic(sc) {
    return sc.e + (sc.sub ? '<span class="ks-sub">' + sc.sub + '</span>' : "");
  }

  // 真ん中の絵と、ものさしの見た目を、いまの状態に合わせる
  function koeShow() {
    var st = document.getElementById("koe-stage"), r = koe.r, q = koe.q, picking = koe.step === "pick";
    r.classList.toggle("pick", picking);
    r.classList.toggle("two", picking && easy);
    Array.prototype.forEach.call(r.querySelectorAll(".kr-zone"), function (z) {
      z.classList.remove("dim", "hint", "right");
      z.classList.toggle("want", !!q && +z.getAttribute("data-lv") === q.lv);
    });
    koe.hero = koe.orb = null;
    if (picking) {
      st.innerHTML = '<div class="koe-scene"><span class="ks-pic">' + scenePic(koe.scene) + '</span><span class="ks-t">' + koe.scene.t + '</span></div>';
      return;
    }
    if (koe.mic === "denied" || koe.mic === "none") {
      st.innerHTML = '<div class="koe-scene koe-nomic"><span class="ks-pic">🎤</span><span class="ks-t">マイクが つかえないよ</span></div>';
      return;
    }
    var L = q ? KOE_LV[q.lv] : null;
    st.innerHTML = '<div class="koe-hero' + (q ? "" : " free") + '">' +
      '<svg class="koe-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" cx="50" cy="50" r="46"/></svg>' +
      '<div class="koe-orb"><span class="koe-emo">' + (L ? L.e : "🎤") + '</span></div>' +
      (q ? '<div class="koe-bubble">' + esc(q.word) + '</div>' : "") +
      (q && q.scene ? '<div class="koe-mini">' + scenePic(q.scene) + '</div>' : "") + '</div>';
    koe.hero = st.querySelector(".koe-hero");
    koe.orb = st.querySelector(".koe-orb");
    koe.emo = st.querySelector(".koe-emo");
    koe.fg = st.querySelector(".koe-ring .fg");
    koe.band = -2;
    koe.sc = 0;
    koeColor(q ? q.lv : -1);
  }

  function koeColor(lv) {
    var L = KOE_LV[lv];
    koe.hero.style.setProperty("--c", L ? L.c : "#f3ece1");
    koe.hero.style.setProperty("--ce", L ? L.ce : "#e2d4bf");
  }

  // ものさしの下の ひとこと（マイクのようす・ヒント）
  function koeMsg() {
    var box = document.getElementById("koe-msg"), q = koe.q, h = "";
    if (koe.mic === "wait") h = "マイクを じゅんびしているよ<span class='sub'>（はじめてのときは、マイクの「許可」を おしてください）</span>";
    else if (koe.mic === "denied") h = "マイクが つかえません<span class='sub'>保護者の方へ：iPad の 設定 →（アプリ →）Safari → マイク を「許可」にして、開きなおしてください</span>";
    else if (koe.mic === "none") h = "この たんまつでは マイクが つかえません";
    else if (koe.stall) h = "がめんを タッチしてね";
    else if (q && q.hinted && !q.done) h = (q.dir < 0 ? "もうすこし ちいさく" : "もうすこし おおきく") + '<button class="pill" id="koe-skip">つぎへ</button>';
    else if (koe.mode === "free" && koeCal.base === null) h = "<span class='sub'>保護者の方へ：声の大きさの きじゅんは、保護者メニューで ちょうせいできます</span>";
    if (box._h === h) return;
    box._h = h;
    box.innerHTML = h;
  }

  function koeFrame(db, dt, muted, stalled) {
    if (!koe || current !== "koe") return;
    if (stalled !== koe.stall) { koe.stall = stalled; koeMsg(); }
    meterStep(koe.m, muted ? null : db, dt);
    var b = steadyBand(koe.sb, koeBand(koe.m.d), dt), picking = koe.step === "pick" || koe.step === "picked";
    rulerSet(koe.r, picking ? 0 : koePos(koe.m.d), picking ? -1 : b);
    if (!koe.orb) return;
    if (koe.mode === "free") koeFree(b);
    else if (koe.step === "say" && !koe.q.done && !muted) koeJudge(dt);
  }

  // じゆう：声が大きいほど まるが大きくなり、中の どうぶつが かわる。声を出しているあいだ 波がひろがる
  function koeFree(b) {
    var s = .62 + koePos(koe.m.d) * .5;
    if (Math.abs(s - koe.sc) > .004) { koe.orb.style.scale = s.toFixed(3); koe.sc = s; }
    if (b !== koe.band) {
      koe.band = b;
      koe.emo.textContent = b < 0 ? "🎤" : KOE_LV[b].e;
      koeColor(b);
      koe.emo.classList.remove("pop");
      void koe.emo.offsetWidth;
      if (b >= 0) koe.emo.classList.add("pop");
    }
    var now = performance.now();
    if (b >= 0 && now - koe.waveAt > [620, 440, 300][b]) {
      koe.waveAt = now;
      var w = el("span", "koe-wave");
      w.style.setProperty("--s0", s.toFixed(3));
      koe.hero.insertBefore(w, koe.hero.firstChild); // 絵のうしろに
      setTimeout(function () { w.remove(); }, 1300);
    }
  }

  // ねらった大きさの声のあいだ わっかが たまり、ちがう大きさのあいだは 少しずつ もどる（声の切れ目は数えない）
  function koeJudge(dt) {
    var q = koe.q, b = koeBand(koe.m.j), now = performance.now();
    if (b === q.lv) { q.hold += dt; q.onT = now; }
    else if (b >= 0) {
      q.hold = Math.max(0, q.hold - dt * 1.5);
      q.off += dt;
      var dir = b > q.lv ? -1 : 1;
      if (dir !== q.dir) { q.dir = dir; if (q.hinted) koeMsg(); }
    }
    var on = now - q.onT < 300; // 声の切れ目で ぱたぱた しないよう、少しのあいだ続ける
    if (on !== q.on) { q.on = on; koe.orb.classList.toggle("happy", on); }
    var f = Math.min(1, q.hold / KOE_HOLD);
    if (Math.abs(f - q.shown) > .008) { q.shown = f; koe.fg.style.strokeDashoffset = (289.1 * (1 - f)).toFixed(1); }
    if (q.hold >= KOE_HOLD) { koeDone(); return; }
    if (!q.hinted && q.off > 2000) {
      q.hinted = true;
      koeMsg();
      say(q.dir < 0 ? "もうすこし ちいさく" : "もうすこし おおきく");
    }
  }

  function koeDone() {
    var q = koe.q;
    q.done = true;
    koe.orb.classList.remove("happy");
    koe.orb.classList.add("yay");
    koe.fg.style.strokeDashoffset = 0;
    play("right");
    burst(koe.orb, 12);
    koeStar(1400);
  }
  // ヒントのあとの「つぎへ」：できなくても先へ進める（星は「やりきった数」なので つく）
  function koeSkip() {
    if (!koe.q || koe.q.done) return;
    koe.q.done = true;
    play("tap");
    koeStar(350);
  }
  function koeStar(ms) {
    koe.i++;
    drawDots("koe-dots", ROUND, koe.i);
    koeMsg();
    later(koeNext, ms);
  }

  // ものさしの所をタッチ：どんなとき では答え。ほかでは その声の名前を読む
  document.getElementById("koe-ruler").addEventListener("click", function (e) {
    var z = e.target.closest(".kr-zone");
    if (!z || !koe) return;
    var lv = +z.getAttribute("data-lv");
    if (koe.step !== "pick") {
      if (koe.step !== "picked") say(KOE_LV[lv].name);
      return;
    }
    var sc = koe.scene;
    if (lv !== sc.lv) {
      // 減点なし・バツなし。そっと しぼむだけで、1回外すと 合う所に枠が出る
      z.classList.add("dim");
      var right = koe.r.querySelector('.kr-zone[data-lv="' + sc.lv + '"]');
      if (right) right.classList.add("hint");
      return;
    }
    koe.step = "picked";
    z.classList.remove("hint");
    z.classList.add("right");
    play("right");
    burst(z, 10);
    // マイクが使えないときは、えらべたら おしまい（言うのは とばす）
    if (koe.mic === "denied" || koe.mic === "none") { koeStar(900); return; }
    later(function () { koeSayQ(sc.lv, sc.w, sc); }, 900);
  });
  document.getElementById("koe-msg").addEventListener("click", function (e) {
    if (e.target.closest("#koe-skip")) koeSkip();
  });
  // 「がめんを タッチしてね」のとき（マイクの音が とどかない）は、タッチで起こす。
  // 止まっていた音の処理は マイクのところの pointerdown で起こし、動いているのに音が来ないときだけ マイクを開きなおす
  document.getElementById("s-koe").addEventListener("pointerdown", function () {
    if (koe && koe.stall && (!mic || !mic.ctx || mic.ctx.state === "running")) koeListen();
  });
  // ほかのアプリに切りかえたら マイクを止め、もどってきたら また聞く
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) micStop();
    else if (current === "koe" && koe) koeListen();

  /* ============ シール ============ */
  // あそびを最後までやると1まいもらえる。ホームの「シール」で、ページのすきな所にはれる
  var STICKER_POOL = ["🐶", "🐱", "🐰", "🐻", "🐼", "🐨", "🐯", "🦁", "🐮", "🐷", "🐸", "🐵", "🐔", "🐧", "🐤", "🦄",
    "🐙", "🦀", "🐠", "🐳", "🦋", "🐞", "🐝", "🌷", "🌻", "🌈", "⭐", "🌙", "☀️", "🍎", "🍓", "🍒", "🍉", "🍩",
    "🍭", "🧁", "🍦", "🚗", "🚃", "🚀", "✈️", "🚒", "🎈", "🎀", "💎", "👑", "❤️", "🍀"];

  // まだ持っていない絵から出す（ぜんぶ持っていたら、どれでも）
  function giveSticker() {
    var have = stickers.map(function (s) { return s.e; });
    var fresh = STICKER_POOL.filter(function (e) { return have.indexOf(e) === -1; });
    var s = { e: pick(fresh.length ? fresh : STICKER_POOL), on: false, x: 0, y: 0, r: Math.round(Math.random() * 24 - 12) };
    stickers.push(s);
    if (stickers.length > 300) stickers = stickers.slice(-300);
    save(KEY_STICKERS, stickers);
    return s;
  }

  function renderStickers() {
    var page = document.getElementById("stk-page"), tray = document.getElementById("stk-tray");
    page.innerHTML = "";
    tray.innerHTML = "";
    stickers.forEach(function (s, i) {
      var d = el("div", "stk");
      d.textContent = s.e;
      d.setAttribute("data-i", i);
      d.style.setProperty("--r", s.r + "deg");
      if (s.on) {
        d.style.left = (s.x * 100).toFixed(2) + "%";
        d.style.top = (s.y * 100).toFixed(2) + "%";
        d.addEventListener("pointerdown", stkDown);
        d.addEventListener("pointermove", stkMove);
        d.addEventListener("pointerup", stkUp);
        d.addEventListener("pointercancel", stkUp);
        page.appendChild(d);
      } else {
        d.addEventListener("click", function () { stickOn(i); });
        tray.appendChild(d);
      }
    });
    if (!stickers.length) tray.innerHTML = '<div class="empty">あそびを さいごまで やると、シールが もらえるよ</div>';
    else if (!tray.children.length) tray.innerHTML = '<div class="empty">ぜんぶ はったよ</div>';
    document.getElementById("stk-count").textContent = stickers.length ? "シール " + stickers.length + "まい" : "";
  }

  // 下のシールをタッチすると、ページの あいている所に はる
  function stickOn(i) {
    var page = document.getElementById("stk-page");
    var W = page.clientWidth, H = page.clientHeight;
    var best = [.5, .5], bestGap = -1;
    for (var t = 0; t < 40; t++) {
      var x = .1 + Math.random() * .8, y = .14 + Math.random() * .74, gap = Infinity;
      stickers.forEach(function (o) { if (o.on) gap = Math.min(gap, Math.hypot((o.x - x) * W, (o.y - y) * H)); });
      if (gap > bestGap) { bestGap = gap; best = [x, y]; }
    }
    stickers[i].on = true;
    stickers[i].x = best[0];
    stickers[i].y = best[1];
    save(KEY_STICKERS, stickers);
    play("peta");
    renderStickers();
    var d = document.querySelector('#stk-page .stk[data-i="' + i + '"]');
    if (d) d.classList.add("pop");
  }

  // ページのシールは、指で うごかせる。下の たなへ もどすと、はがれる
  var sd = null;
  function stkDown(e) {
    e.preventDefault();
    var d = e.currentTarget;
    sd = { d: d, i: +d.getAttribute("data-i"), id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false };
    try { d.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function stkMove(e) {
    if (!sd || e.pointerId !== sd.id) return;
    var dx = e.clientX - sd.x0, dy = e.clientY - sd.y0;
    if (!sd.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
    sd.moved = true;
    sd.d.classList.add("lift");
    sd.d.style.translate = dx + "px " + dy + "px";
  }
  function stkUp(e) {
    if (!sd || e.pointerId !== sd.id) return;
    var s = sd;
    sd = null;
    if (!s.moved || e.type === "pointercancel") {
      s.d.style.translate = "";
      s.d.classList.remove("lift", "pop");
      void s.d.offsetWidth;
      s.d.classList.add("pop"); // タッチすると、ぷるんとする
      if (!s.moved) play("peta");
      return;
    }
    var st = stickers[s.i];
    var page = document.getElementById("stk-page").getBoundingClientRect();
    var tray = document.getElementById("stk-tray").getBoundingClientRect();
    if (e.clientY > tray.top && e.clientY < tray.bottom + 40) {
      st.on = false;
    } else {
      st.x = Math.max(.04, Math.min(.96, st.x + (e.clientX - s.x0) / page.width));
      st.y = Math.max(.05, Math.min(.95, st.y + (e.clientY - s.y0) / page.height));
    }
    save(KEY_STICKERS, stickers);
    play("peta");
    renderStickers();
  }

  /* ============ スケジュール ============ */
  function renderSched(justId) { // justId: いま押した項目（そこだけ はずませる）
    ensureToday();
    var box = document.getElementById("sched-list");
    box.innerHTML = "";
    if (!sched.length) {
      box.innerHTML = '<div class="empty">よていが ありません<br><span class="muted">（右上を3秒おしで 保護者メニュー）</span></div>';
      return;
    }
    var nowIdx = sched.findIndex(function (it) { return schedDone.done.indexOf(it.id) === -1; });
    sched.forEach(function (it, i) {
      var done = schedDone.done.indexOf(it.id) !== -1;
      var b = document.createElement("button");
      b.className = "sched-item" + (done ? " done" : "") + (i === nowIdx ? " now" : "");
      b.innerHTML = '<span class="ico">' + esc(it.ico) + '</span>' +
                    '<span class="label">' + esc(it.label) + '</span>' +
                    '<span class="check' + (it.id === justId ? " just" : "") + '">' + (done ? "✓" : "") + '</span>';
      b.addEventListener("click", function () {
        ensureToday();
        var p = schedDone.done.indexOf(it.id);
        var nowDone = p === -1;
        if (nowDone) schedDone.done.push(it.id); else schedDone.done.splice(p, 1);
        save(KEY_SCHED_DONE, schedDone);
        play(nowDone ? "check" : "tap");
        renderSched(nowDone ? it.id : null);
      });
      box.appendChild(b);
    });
  }

  // 開きっぱなしのまま日付が変わったとき・アプリに戻ってきたときに、表示を今日の状態に戻す

  /* --- こえの ものさし の ちょうせい（保護者メニュー） --- */
  var calM = null; // ちょうせい中：{ m：はりの なめらかさ, rec：はかっている途中 }
  function calNow() {
    return "いまの きじゅん：" + (koeCal.base === null ? "おまかせ（まわりの静かさから決めています）" : "ちょうせいずみ（はかった ふつうの声）");
  }
  function calListen() {
    calM = { m: { j: -120, d: -120 }, sb: { b: -1 }, rec: null };
    var st = document.getElementById("cal-st"), go1 = document.getElementById("cal-go");
    st.textContent = "マイクを じゅんびしています…（はじめてのときは「許可」を押してください）";
    go1.disabled = true;
    micStart(calFrame, function (why) {
      if (current !== "parent") return;
      st.textContent = why === "denied" ? "マイクが 許可されていません。設定 →（アプリ →）Safari → マイク を確かめてください。" : "この端末では マイクが使えません。";
    }, function () {
      if (current !== "parent" || !calM) return;
      st.textContent = "声を出すと、はりが うごきます。";
      go1.disabled = false;
    });
  }
  function calFrame(db, dt, muted) {
    var r = document.getElementById("cal-ruler");
    if (current !== "parent" || !calM || !r) return;
    meterStep(calM.m, muted ? null : db, dt);
    rulerSet(r, koePos(calM.m.d), steadyBand(calM.sb, koeBand(calM.m.d), dt));
    var rec = calM.rec, st = document.getElementById("cal-st");
    if (!rec || muted) return;
    rec.t += dt;
    // 声の出ているこまだけを集める（ことばの切れ目は入れない）
    if (db !== null && db > koeGate() + 4) { rec.vals.push(db); rec.on += dt; }
    var left = Math.max(1, Math.ceil((3000 - rec.t) / 1000));
    if (left !== rec.left) { rec.left = left; st.textContent = "ふつうの声で 話してください… " + left; }
    if (rec.t < 3000) return;
    calM.rec = null;
    document.getElementById("cal-go").disabled = false;
    if (rec.on < 700) { st.textContent = "声が きこえませんでした。もう一度 押してください。"; return; }
    rec.vals.sort(function (a, b) { return a - b; });
    koeCal.base = rec.vals[Math.floor(rec.vals.length / 2)];
    fixKoeCal();
    save(KEY_KOE, koeCal);
    document.getElementById("cal-now").textContent = calNow();
    st.textContent = "はかりました。ちいさい声・おおきい声も出して、はりの行く所を 確かめてください。";
    play("check");
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && current === "parent" && calM) calListen();
  });

  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
  }

            "・音は「音」の欄で切り替え（初めは出る）。やわらかい短い音だけで、まちがえたときは鳴らない<br>" +
            "・間違えても×は出ず、選択肢が薄くなるだけ。1回外すと正解の枠がそっと出る<br>" +
            "・1セッション5問。上の星で「あと何問か」が見える＝終わりが目で見える<br>" +
            "・「あそぶ子に合わせる」で 2〜3さい にすると、選ぶものが2つになり、パズル・きおくのピースも少なくなる<br>" +
            "・なぞり／あいうえお／おえかきは記録なし。ゆびが少しずれても進むので、小さい子でも最後まで行ける<br>" +
            "・なぞりは「よこ線→なみ→うずまき」のように、やさしい順で3つ<br>" +
            "・あいうえお／カタカナ／すうじ なぞり は、お手本の字をそのまま出し、書く順に1画ずつ、なぞったところが緑になる。いまの画の上に点がならび、書きはじめは番号の丸、おわりは星。まだなぞっていない画には緑がはみ出さない。" +
            "はじめに あいうえお ひょう が出て、五十音の順に1字ずつ つづけて書く（ひょうの字を押すと その字から）。いつでも右下の「おしまい」で終われて、つぎは その字から。書いた字は ひょうに はなまる<br>" +
            "・パズルは1回3つで、ピースが2→3→4と増える。ちがう場所に置くと戻るだけで、1回まちがえるとそのピースと正しい場所に枠が出る。" +
            "指で動かすほか、ピースをタップ→置く場所をタップ でも置ける<br>" +
            "・同じ答えは続けて出さない（2通りしかない課題は3回続けない）。正解の場所も3回続けて同じにしない<br>" +
            "・しゃぼんだま・ふうせんは記録なしの自由あそび。逃げたり消えたりせず、8こ割ったらおしまい<br>" +
            "・もっきん：たたくと音が鳴る（指をすべらせても鳴る）。「うた」を選ぶと次にたたく板が光る。ちがう板も鳴るだけで、まちがいにしない（記録なし）<br>" +
            "・いないいない ばあ：タッチすると布が上がって、どうぶつが出てくる。8回でおしまい（記録なし）<br>" +
            "・ぬりえ：色を選んで、ぬりたい所をタッチ。線の中だけがぬれて、はみ出さない（記録なし）<br>" +
            "・てんつなぎ：1から順に点をつなぐと絵が出る。点は 5〜6 → 7〜8 → 9〜10 と増える。ちがう点を押すと、次の点がそっと光る（記録なし）<br>" +
            "・めいろ：ゆびで どうぶつを動かしてゴールへ。壁のむこうへは行けないだけで、時間制限なし。3→4→5だん と広くなる（記録なし）<br>" +
            "・ことばづくり：絵を見て、文字カードをことばの順にタッチ。わくに うすいお手本の字がある。2→3→4文字。" +
            "ちがうカードは ゆれるだけで、1回まちがえると正しいカードに枠が出る。4さい〜 のときは、ことばに無い字のカードが1まい まざる<br>" +
            "・こえの ものさし：マイクで声の大きさだけを見て（録音・送信なし）、ちいさい（ありさん）／ふつう（ねこさん）／おおきい（ぞうさん）の3つで見せる。" +
            "じゆう・いってみよう（言われた大きさで言う）・どんなとき（場面に合う声をえらんで言う）。合わなくても×はなく、しばらくすると「もうすこし ちいさく」などのヒントと「つぎへ」が出る。" +
            "2〜3さい のときは ちいさい と おおきい だけ（記録なし）<br>" +
            "・シール：あそびを最後までやると1まいもらえる。ホームの「シール」で、ページにはれる<br>" +
            "・よみあげ：お題を端末の声で読む。お題のラベルをタッチすると もう一度読む<br>" +
            "・iPad の「アクセスガイド」（設定→アクセシビリティ）を使うとアプリから出られなくできる<br>" +
            "・メニューは種類ごとの たなに分けて並べる（くらべる／いろ・かたち／かず／ことば／かく／パズル／おと・あそび）。iPad の横向きでは1画面に収まる<br>" +
            "・保護者メニューは右上を3秒長押し" +
            "</p></div>";

    body.innerHTML = html;

    document.getElementById("add-sched").addEventListener("click", function () {
      var ico = document.getElementById("new-ico").value.trim() || "⭐";
      var lab = document.getElementById("new-lab").value.trim();
      if (!lab) return;
      sched.push({ id: newId(), ico: ico, label: lab });
      save(KEY_SCHED, sched);
      renderParent();
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () {
        var gone = sched.splice(parseInt(b.getAttribute("data-del"), 10), 1)[0];
        var p = gone ? schedDone.done.indexOf(gone.id) : -1;
        if (p !== -1) { schedDone.done.splice(p, 1); save(KEY_SCHED_DONE, schedDone); }
        save(KEY_SCHED, sched); renderParent();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-preset]"), function (b) {
      b.addEventListener("click", function () {
        var young = b.getAttribute("data-preset") === "young";
        easy = young;
        save(KEY_MODE, { easy: easy });
        hidden = young ? MENU_ORDER.filter(function (k) { return ageOf(k) >= 4; }) : [];
        save(KEY_HIDDEN, hidden);
        play("check");
        renderParent();
      });
    });
    document.getElementById("snd").addEventListener("change", function () {
      soundOn = this.checked;
      save(KEY_SOUND, { on: soundOn });
      play("check"); // 鳴るようになったか、その場で確かめられる
    });
    document.getElementById("voice").addEventListener("change", function () {
      voiceOn = this.checked;
      save(KEY_VOICE, { on: voiceOn });
      markVoice();
      if (voiceOn) say("あか さがして"); // 聞こえるか、その場で確かめられる
      else hush();
    });
    document.getElementById("cal-open").addEventListener("click", function () {
      var box = document.getElementById("koe-cal");
      box.hidden = !box.hidden;
      this.textContent = box.hidden ? "マイクで ちょうせいする" : "ちょうせいを とじる";
      if (box.hidden) { micStop(); calM = null; } else calListen();
    });
    document.getElementById("cal-go").addEventListener("click", function () {
      if (!calM || calM.rec) return;
      calM.rec = { t: 0, on: 0, vals: [], left: 0 };
      this.disabled = true;
    });
    ["d1", "d2"].forEach(function (k) {
      document.getElementById("cal-" + k).addEventListener("input", function () {
        koeCal[k] = +this.value;
        fixKoeCal();
        save(KEY_KOE, koeCal);
      });
    });
    document.getElementById("cal-reset").addEventListener("click", function () {
      koeCal = {};
      fixKoeCal();
      save(KEY_KOE, koeCal);
      document.getElementById("cal-d1").value = koeCal.d1;
      document.getElementById("cal-d2").value = koeCal.d2;
      document.getElementById("cal-now").textContent = calNow();
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-hyo-reset]"), function (b) {
      b.addEventListener("click", function () {
        var k = b.getAttribute("data-hyo-reset");
        if (!confirm(HYO_NAME[k] + " の はなまるを ぜんぶ消して、はじめの字から にします。よろしいですか？")) return;
        traceLog[k] = { next: 0, done: [] };
        save(KEY_TRACE, traceLog);
        renderParent();
      });
    });
    document.getElementById("clear-stk").addEventListener("click", function () {
      if (confirm("もらったシールを すべて消します。よろしいですか？")) {
        stickers = [];
        save(KEY_STICKERS, stickers);
        renderParent();
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-vis]"), function (cb) {
      cb.addEventListener("change", function () {
        var k = cb.getAttribute("data-vis");
        hidden = hidden.filter(function (x) { return x !== k; });
        if (!cb.checked) hidden.push(k);
        save(KEY_HIDDEN, hidden);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-up]"), function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-up"), 10);
        if (i === 0) return;
        var t = sched[i - 1]; sched[i - 1] = sched[i]; sched[i] = t;
        save(KEY_SCHED, sched); renderParent();
      });
    });
    document.getElementById("clear-log").addEventListener("click", function () {
      if (confirm("記録をすべて消します。よろしいですか？")) {
        log = []; save(KEY_LOG, log); renderParent();
      }
    });
    document.getElementById("copy-log").addEventListener("click", function () {
      var lines = ["日付,課題,一発正解"];
      log.forEach(function (r) {
        lines.push(dayKey(r.t) + "," + (menuItem(r.task) ? menuItem(r.task).label : r.task) + "," + r.first);
      });
      var txt = lines.join("\n");
      function manual() { prompt("コピーしてください", txt); }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(function () { alert("コピーしました"); }, manual);
      } else {
        manual();
      }
    });
  }

  // 新しく増えた あそびは、2〜3さい向けにしているときは メニューに出さない（4さい〜 のもの。保護者メニューで出せる）
  (function () {
    var fresh = ["mokkin", "baa", "nurie", "tentsunagi", "meiro", "kotobazukuri", "koe"]; // known の記録がない（前の版から使っている）人にとって、新しいもの
    var stored = null;
    try { stored = localStorage.getItem(KEY_KNOWN); } catch (e) {}
    var known = stored === null ? MENU_ORDER.filter(function (k) { return fresh.indexOf(k) === -1; }) : load(KEY_KNOWN, []);
    var added = MENU_ORDER.filter(function (k) { return known.indexOf(k) === -1; });
    if (easy && added.length) {
      added.forEach(function (k) { if (ageOf(k) >= 4 && hidden.indexOf(k) === -1) hidden.push(k); });
      save(KEY_HIDDEN, hidden);
    }
    save(KEY_KNOWN, MENU_ORDER);
  })();

  go("home");
})();
</script>
</body>
</html>
